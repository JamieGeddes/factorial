name: Deploy

# Runs after CI succeeds on main, or on demand. Assumes the factorial-deploy
# role through GitHub OIDC (no stored keys) and deploys Factorial's stacks in
# order. The foundation stack (00-*) is excluded: it is deployed by a human.
# A push that changes only non-functional paths since the last successful
# deploy (see scripts/classify-changes.ts) is skipped without touching a stack.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-factorial
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  # Classifies the pushed commit against the last successfully deployed one
  # (the `FactorialVersion` parameter on the `factorial-orchestration` stack)
  # using scripts/classify-changes.ts, the single definition of what is
  # non-functional. A docs-only push lands on the deploy job as a no-op
  # instead of redeploying anything.
  classify:
    name: Compare against the last deployed commit
    # Same trust gate as the deploy job, applied before anything is checked
    # out or any credential is obtained: only a successful CI run of a push
    # to main in this repository, or an on-demand run from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # The deploy role trusts only jobs in this environment (environment
    # subject in the OIDC token), so reading the deployed version needs it too.
    environment: production
    runs-on: ubuntu-latest
    outputs:
      functional: ${{ steps.classify.outputs.functional }}
    steps:
      # Actions are pinned to full commit SHAs (v5 at the time of pinning).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The classifier diffs against the last deployed commit, which a
          # shallow checkout does not contain.
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: factorial-deploy-classify-${{ github.run_id }}
          # The account ID is a secret in the logs: v4 of the action does not mask
          # it by default, and it appears in ECR registry hosts and ARNs.
          mask-aws-account-id: true

      - name: Read the last deployed commit
        id: version
        run: |
          set -euo pipefail
          # The orchestration stack does not exist yet on a first deployment.
          version=$(aws cloudformation describe-stacks --stack-name factorial-orchestration \
            --query "Stacks[0].Parameters[?ParameterKey=='FactorialVersion'].ParameterValue" \
            --output text 2>/dev/null || true)
          if [ -z "$version" ] || [ "$version" = "None" ]; then
            echo "factorial-orchestration has no FactorialVersion yet; nothing has been deployed."
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Last deployed commit is $version."
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - id: classify
        uses: ./.github/actions/classify-changes
        with:
          # Empty when nothing has been deployed yet; the action then treats
          # the change as functional.
          base: ${{ steps.version.outputs.version }}
          head: ${{ github.event.workflow_run.head_sha || github.sha }}

  deploy:
    name: Deploy Factorial stacks
    needs: classify
    # Runtime V2 prepares a snapshot per version (minutes each) in the stack
    # update and again on promotion.
    timeout-minutes: 90
    # Deploy only from a successful CI run of a push to main in this repository
    # (CI also runs for pull requests), or an on-demand run from main; and skip
    # everything when only non-functional paths changed since the last
    # successful deploy (an explicit workflow_dispatch always deploys). A
    # skipped job reports success.
    if: >-
      !cancelled() && needs.classify.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (needs.classify.outputs.functional != 'false' ||
       github.event_name == 'workflow_dispatch')
    # The deploy role trusts only jobs in this environment, whose deployment
    # branch policy allows only main (see docs/bootstrap.md).
    environment: production
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # No Actions cache: the dispatched test workflow runs untrusted code on a
      # main-branch ref, and a poisoned cache must never reach this job.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Build Lambda bundles
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: factorial-deploy-${{ github.run_id }}
          # The account ID is a secret in the logs: v4 of the action does not mask
          # it by default, and it appears in ECR registry hosts and ARNs.
          mask-aws-account-id: true

      - name: Confirm identity
        run: aws sts get-caller-identity --query Arn --output text | sed -E 's/[0-9]{12}/<account>/'

      - name: Read foundation exports
        id: foundation
        run: |
          set -euo pipefail
          cfn_role=$(aws cloudformation list-exports --query "Exports[?Name=='Factorial-CloudFormationRoleArn'].Value" --output text)
          bucket=$(aws cloudformation list-exports --query "Exports[?Name=='Factorial-ArtefactBucketName'].Value" --output text)
          invoker_repo_uri=$(aws cloudformation list-exports --query "Exports[?Name=='Factorial-InvokerRepositoryUri'].Value" --output text)
          runtime_repo_uri=$(aws cloudformation list-exports --query "Exports[?Name=='Factorial-AgentRuntimeRepositoryUri'].Value" --output text)
          test -n "$cfn_role" && test -n "$bucket" && test -n "$invoker_repo_uri" && test -n "$runtime_repo_uri"
          echo "::add-mask::$cfn_role"
          echo "::add-mask::$bucket"
          echo "::add-mask::$invoker_repo_uri"
          echo "::add-mask::$runtime_repo_uri"
          echo "cfn_role=$cfn_role" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "invoker_repo_uri=$invoker_repo_uri" >> "$GITHUB_OUTPUT"
          echo "runtime_repo_uri=$runtime_repo_uri" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push the invoker image when its inputs change
        id: invoker
        env:
          REPO_URI: ${{ steps.foundation.outputs.invoker_repo_uri }}
        run: |
          set -euo pipefail
          tag=$(git rev-parse HEAD:invoker HEAD:packages/invoker HEAD:packages/artefacts HEAD:packages/log HEAD:packages/workitem HEAD:package-lock.json | sha256sum | cut -c1-32)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name factorial/invoker --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            echo "Invoker image $tag already exists; skipping the build."
            exit 0
          fi
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO_URI%%/*}"
          docker buildx build --platform linux/arm64 --provenance=false --push \
            --tag "$REPO_URI:$tag" invoker/
          echo "Pushed invoker image $tag."

      # The host bundle (agent-runtime/dist) comes from "Build Lambda bundles"
      # above. The tag covers everything the image is built from: the image
      # directory with its own lockfile, the host and the workspace packages
      # it bundles (the plan and review packages with their contracts),
      # quiet's source, and the root lockfile.
      - name: Build and push the agent runtime image when its inputs change
        id: runtime_image
        env:
          REPO_URI: ${{ steps.foundation.outputs.runtime_repo_uri }}
        run: |
          set -euo pipefail
          tag=$(git rev-parse HEAD:agent-runtime HEAD:packages/agent-runtime HEAD:packages/log HEAD:packages/artefacts HEAD:packages/plan HEAD:contracts/plan HEAD:packages/review HEAD:contracts/review HEAD:packages/agent-tools HEAD:package-lock.json | sha256sum | cut -c1-32)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name factorial/agent-runtime --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            echo "Agent runtime image $tag already exists; skipping the build."
            exit 0
          fi
          test -f agent-runtime/dist/host.mjs && test -f agent-runtime/dist/quiet.mjs
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO_URI%%/*}"
          docker buildx build --platform linux/arm64 --provenance=false --push \
            --tag "$REPO_URI:$tag" agent-runtime/
          echo "Pushed agent runtime image $tag."

      - name: Deploy stacks in order
        env:
          CFN_ROLE: ${{ steps.foundation.outputs.cfn_role }}
          BUCKET: ${{ steps.foundation.outputs.bucket }}
          INVOKER_IMAGE_TAG: ${{ steps.invoker.outputs.tag }}
          AGENT_RUNTIME_IMAGE_TAG: ${{ steps.runtime_image.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          templates=(templates/[1-9]*.yml)
          if [ ${#templates[@]} -eq 0 ]; then
            echo "No deployable templates yet (only the human-deployed foundation exists)."
            exit 0
          fi
          mkdir -p .packaged
          for template in "${templates[@]}"; do
            name=$(basename "$template" .yml)   # e.g. 10-triggers
            stack="factorial-${name#*-}"        # e.g. factorial-triggers
            echo "::group::Deploying $stack from $template"
            # A stack whose first creation failed sits in ROLLBACK_COMPLETE and
            # cannot be updated. It never held anything, so remove it and retry.
            status=$(aws cloudformation describe-stacks --stack-name "$stack" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NONE)
            if [ "$status" = "ROLLBACK_COMPLETE" ]; then
              echo "$stack is in ROLLBACK_COMPLETE from a failed first creation; deleting it before retrying."
              aws cloudformation delete-stack --stack-name "$stack" --role-arn "$CFN_ROLE"
              aws cloudformation wait stack-delete-complete --stack-name "$stack"
            fi
            params=()
            case "$stack" in
              factorial-agent) params=(--parameter-overrides "AgentRuntimeImageTag=$AGENT_RUNTIME_IMAGE_TAG") ;;
              factorial-orchestration) params=(--parameter-overrides "InvokerImageTag=$INVOKER_IMAGE_TAG" "FactorialVersion=$GITHUB_SHA") ;;
            esac
            # package uploads local artefacts (Lambda bundles) and rewrites
            # their paths to S3 locations.
            aws cloudformation package \
              --template-file "$template" \
              --s3-bucket "$BUCKET" \
              --s3-prefix "artefacts/$stack" \
              --output-template-file ".packaged/$name.yml"
            aws cloudformation deploy \
              --stack-name "$stack" \
              --template-file ".packaged/$name.yml" \
              --role-arn "$CFN_ROLE" \
              --s3-bucket "$BUCKET" \
              --s3-prefix "templates/$stack" \
              --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
              --tags Project=Factorial \
              --no-fail-on-empty-changeset \
              "${params[@]}"
            echo "::endgroup::"
          done

      # Promotion is the last step of a successful deployment: the next
      # WorkItem is handled by the version just deployed. Only this role may
      # move a live endpoint; the permissions boundary denies it to every
      # role Factorial creates for itself. Every runtime is promoted: each
      # role block in the agent template outputs <Role>RuntimeId, so a new
      # role needs no change here. Only a READY version is promoted.
      - name: Promote every runtime live endpoint
        run: |
          set -euo pipefail
          runtime_ids=$(aws cloudformation describe-stacks --stack-name factorial-agent \
            --query "Stacks[0].Outputs[?ends_with(OutputKey, 'RuntimeId')].OutputValue" --output text 2>/dev/null || true)
          if [ -z "$runtime_ids" ] || [ "$runtime_ids" = "None" ]; then
            echo "No runtimes in the agent stack; nothing to promote."
            exit 0
          fi
          for runtime_id in $runtime_ids; do
            # The CLI applies --query to each page separately, so list every
            # READY version and take the highest here (#132).
            latest=$(aws bedrock-agentcore-control list-agent-runtime-versions --agent-runtime-id "$runtime_id" \
              --query "agentRuntimes[?status=='READY'].agentRuntimeVersion" --output text | tr -s '\t ' '\n' | sort -n | tail -n 1)
            if [ -z "$latest" ] || [ "$latest" = "None" ]; then
              echo "::error::$runtime_id has no READY version to promote."
              exit 1
            fi
            # A freshly created endpoint reports no targetVersion yet; fall back
            # to the version actually serving traffic.
            current=$(aws bedrock-agentcore-control get-agent-runtime-endpoint --agent-runtime-id "$runtime_id" --endpoint-name live \
              --query '[targetVersion, liveVersion] | [?@ != null] | [0]' --output text)
            status=$(aws bedrock-agentcore-control get-agent-runtime-endpoint --agent-runtime-id "$runtime_id" --endpoint-name live \
              --query 'status' --output text)
            if [ "$latest" = "$current" ] && [ "$status" = "READY" ]; then
              echo "$runtime_id: live endpoint already at runtime version $latest."
              continue
            fi
            # Re-issuing the update also repairs an endpoint left in a failed state.
            aws bedrock-agentcore-control update-agent-runtime-endpoint --agent-runtime-id "$runtime_id" --endpoint-name live \
              --agent-runtime-version "$latest" --description "Promoted by deploy run $GITHUB_RUN_ID ($GITHUB_SHA)" >/dev/null
            echo "$runtime_id: live endpoint moved from runtime version $current to $latest."
            # On V2 the endpoint prepares a snapshot, which takes minutes.
            deadline=$((SECONDS + 1200))
            while true; do
              status=$(aws bedrock-agentcore-control get-agent-runtime-endpoint --agent-runtime-id "$runtime_id" --endpoint-name live \
                --query 'status' --output text)
              case "$status" in
                READY) echo "$runtime_id: live endpoint READY."; break ;;
                *FAILED) echo "::error::$runtime_id live endpoint is $status."; exit 1 ;;
              esac
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$runtime_id live endpoint still $status after 20 minutes."
                exit 1
              fi
              sleep 15
            done
          done
