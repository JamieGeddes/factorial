name: Test (dispatched by Factorial)

# Factorial's test stage. The orchestrator dispatches this workflow ON THE
# DEFAULT BRANCH, so this definition is always the trusted one; the commit to
# test arrives as an input and is checked out as data. The job that runs the
# repository's checks (untrusted code) has no credentials at all. A separate
# job, which never executes branch code, reports the result to Step Functions
# with the task token through a role that can only send task results.

on:
  workflow_dispatch:
    inputs:
      task_token:
        description: Step Functions task token to report the result to
        required: true
      work_item_id:
        description: WorkItem being verified
        required: true
      sha:
        description: Exact commit to test (40 hex characters)
        required: true

permissions: {}

concurrency:
  group: factorial-test-${{ inputs.work_item_id }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  checks:
    name: Run the repository's checks on the work commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - name: Validate the commit input
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "sha input is not a 40-character commit sha" >&2
            exit 1
          fi
      # Untrusted code is checked out here. No token is persisted, and no
      # Actions cache is used anywhere in Factorial's workflows, so this job
      # cannot seed a cache that a privileged main-branch workflow restores.
      # The task token in the inputs is useless without AWS credentials that
      # can call SendTaskSuccess, which this job cannot obtain.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.sha }}
          path: work
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: work/.nvmrc
      - name: Checks
        id: run
        continue-on-error: true
        working-directory: work
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build
          npm test
          npm run check:yml
          pipx run --spec 'cfn-lint==1.57.2' cfn-lint

  report:
    name: Report the result to Factorial
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74
        with:
          role-to-assume: ${{ secrets.AWS_TEST_CALLBACK_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: factorial-test-${{ github.run_id }}
          # The account ID is a secret in the logs; v4 does not mask it by default.
          mask-aws-account-id: true
      - name: Send the task result
        env:
          TASK_TOKEN: ${{ inputs.task_token }}
          WORK_ITEM_ID: ${{ inputs.work_item_id }}
          SHA: ${{ inputs.sha }}
          CHECKS_JOB: ${{ needs.checks.result }}
          CHECKS_STEP: ${{ needs.checks.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          outcome=failure
          if [ "$CHECKS_JOB" = "success" ] && [ "$CHECKS_STEP" = "success" ]; then outcome=success; fi
          output=$(jq -n --arg runUrl "$RUN_URL" --arg workItemId "$WORK_ITEM_ID" --arg sha "$SHA" --arg outcome "$outcome" \
            '{runUrl: $runUrl, workItemId: $workItemId, sha: $sha, outcome: $outcome}')
          if [ "$outcome" = "success" ]; then
            aws stepfunctions send-task-success --task-token "$TASK_TOKEN" --task-output "$output"
          else
            aws stepfunctions send-task-failure --task-token "$TASK_TOKEN" --error TestsFailed --cause "$output"
            exit 1
          fi
