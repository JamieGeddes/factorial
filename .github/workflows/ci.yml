name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The main-branch ruleset requires the two job names below, so they must report
# on every pull request, including docs-only ones. A first job classifies the
# changed paths with scripts/classify-changes.ts (the single definition of what
# is non-functional) and the checks take a fast path for a non-functional
# change instead of a paths-ignore trigger, which would leave docs-only PRs
# without the required checks.
jobs:
  classify:
    name: Classify the changed paths
    runs-on: ubuntu-latest
    outputs:
      functional: ${{ steps.classify.outputs.functional }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The classifier diffs against the base commit, which a shallow
          # checkout does not contain.
          fetch-depth: 0
      - id: classify
        uses: ./.github/actions/classify-changes
        with:
          # On a push, `github.event.before` is all zeros for the first push of
          # a branch; the action then treats the change as functional.
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  checks:
    name: Typecheck, test and lint
    needs: classify
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (v5 at the time of pinning).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # No Actions cache (see deploy.yml).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - if: needs.classify.outputs.functional == 'true'
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run check:yml
      # Fast path: report the required check as passed without running the
      # repository's checks, because nothing that affects them changed.
      - if: needs.classify.outputs.functional == 'false'
        run: echo "Only non-functional paths changed; skipping typecheck, build, tests and the .yml check."

  templates:
    name: Lint CloudFormation
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - if: needs.classify.outputs.functional == 'true'
        run: pipx run --spec 'cfn-lint==1.57.2' cfn-lint
      - if: needs.classify.outputs.functional == 'false'
        run: echo "Only non-functional paths changed; skipping cfn-lint."

  # Builds the toolchain stage of the agent and orchestration images (all but
  # Factorial's own files) as deploy.yml builds them, then checks each image's
  # git against this runner's: a test that passes in a session must pass here
  # (#274, scripts/check-git-version.ts). Not a required check, so a runner
  # whose git moves past the agreed gap flags it without blocking merges.
  images:
    name: Image toolchains
    needs: classify
    if: needs.classify.outputs.functional == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the toolchain stages
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --provenance=false --target toolchain --load \
            --tag factorial-agent-runtime-toolchain agent-runtime/
          docker buildx build --platform linux/arm64 --provenance=false --target toolchain --load \
            --tag factorial-orchestration-toolchain orchestration/
      - name: Check each image's git against CI's
        run: |
          set -euo pipefail
          run_fixture() {
            docker run --rm --platform linux/arm64 --entrypoint sh \
              -v "$PWD/scripts/git-fixture.sh:/fixture.sh:ro" "$1" /fixture.sh
          }
          sh scripts/git-fixture.sh > "$RUNNER_TEMP/ci.txt"
          run_fixture factorial-agent-runtime-toolchain > "$RUNNER_TEMP/agent-runtime.txt"
          run_fixture factorial-orchestration-toolchain > "$RUNNER_TEMP/orchestration.txt"
          node scripts/check-git-version.ts "$RUNNER_TEMP/ci.txt" \
            "agent-runtime=$RUNNER_TEMP/agent-runtime.txt" \
            "orchestration=$RUNNER_TEMP/orchestration.txt"
      - name: Check the agent toolchain runs
        run: |
          docker run --rm --platform linux/arm64 --entrypoint sh factorial-agent-runtime-toolchain -c \
            'set -e; node --version; python3 --version; cfn-lint --version; gh --version | head -1; jq --version; rg --version | head -1'
