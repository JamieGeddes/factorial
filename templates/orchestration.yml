AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Factorial orchestration: the work ledger, the Step Functions state machine
  (plan -> build -> test -> PR) with its live alias, the rule that starts it from the
  work bus, the Fargate invoker that runs the agents, and the Lambda steps
  around the agent. Deployed by GitHub Actions.

Parameters:
  InvokerImageTag:
    Type: String
    Description: Tag of the invoker image in the factorial/invoker repository.
    AllowedPattern: '^[A-Za-z0-9._-]+$'
  FactorialVersion:
    Type: String
    Description: Git commit of Factorial being deployed. Stamped on every WorkItem it handles.
    AllowedPattern: '^[0-9a-f]{7,40}$'
  ReviewTimeoutSeconds:
    Type: Number
    Default: 1200
    Description: Upper bound for one reviewer run, above the reviewer host's own time limit (FACTORIAL_MAX_DURATION_SECONDS, 900).
  BuildTimeoutSeconds:
    Type: Number
    Default: 7200
    Description: Upper bound for one round of the agent build step, including the builder host's own time limit (FACTORIAL_MAX_DURATION_SECONDS).
  TestTimeoutSeconds:
    Type: Number
    Default: 3600
    Description: How long to wait for the dispatched test workflow to report back.
  LogRetentionDays:
    Type: Number
    Default: 30
  DefaultBranch:
    Type: String
    Default: main
    Description: Branch whose test workflow definition is trusted and dispatched.
  ArtefactRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: Days a run's artefacts are kept before the lifecycle rule expires them.

# Settings changed only by a pull request. A parameter would not do: the
# deploy keeps a stack's existing parameter values, so a changed Default
# never takes effect.
Mappings:
  Builder:
    # How many builder sessions one work item may use before an unfinished
    # build is reported as incomplete. Each round is a fresh session that
    # continues from the branch and the builder's notes. 3 since the spike
    # (docs/harness-vs-runtime.md, Spike results): no successful item on the
    # Runtime needed a second round.
    MaxRounds:
      Value: 3

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 300
    AutoPublishAlias: live
    PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        TABLE_NAME: !Ref WorkItemsTable
        THREADS_TABLE_NAME: !Ref ThreadsTable
        EVENT_BUS_NAME: !ImportValue Factorial-WorkBusName
        ARTEFACT_BUCKET: !Ref WorkArtefactsBucket
        RUNTIME_QUALIFIER: live
        BUILDER_RUNTIME_ARN: !ImportValue Factorial-BuilderRuntimeArn
        REVIEWER_RUNTIME_ARN: !ImportValue Factorial-ReviewerRuntimeArn
        GITHUB_APP_ID_PARAM: /factorial/github/app-id
        GITHUB_INSTALLATION_ID_PARAM: /factorial/github/installation-id
        GITHUB_PRIVATE_KEY_SECRET: factorial/github/app-private-key
        TEST_WORKFLOW_FILE: test.yml
    Tags:
      Project: Factorial

Resources:
  # ---------------------------------------------------------------------------
  # Ledger: one row per WorkItem. Also the idempotency guard against duplicate
  # deliveries, since EventBridge cannot name executions. The thread index
  # lists the turns in one thread (#163); Intake reads it to resume an attempt
  # that failed after saving its work. The group and parent indexes list the
  # items one trigger produced (WorkItem `group`) and the items a parent
  # emitted (`parentId`); both are sparse, holding only items with that field.
  # A table update can add or delete only one index, so each index change
  # needs its own deploy.
  # ---------------------------------------------------------------------------
  WorkItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: factorial-work-items
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: workItemId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: parentId
          AttributeType: S
        - AttributeName: threadKey
          AttributeType: S
      KeySchema:
        - AttributeName: workItemId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: groupId-createdAt-index
          KeySchema:
            - AttributeName: groupId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - groupSize
              - groupIndex
              - parentId
        - IndexName: parentId-createdAt-index
          KeySchema:
            - AttributeName: parentId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - groupId
              - groupIndex
        - IndexName: threadKey-createdAt-index
          KeySchema:
            - AttributeName: threadKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - route
              - sourceKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Threads (#163): one row per branch Factorial works on, the unit of
  # continuity. Intake resolves every item to a thread and admits it with a
  # conditional write on the row: which turn holds the thread, and how many
  # automatic reworks have run since a person last asked. Pointers and counts
  # only, never content. A pull request maps to its thread through the
  # pull request index, a request to the threads it opened through the
  # source index; both are sparse and project only the key.
  # ---------------------------------------------------------------------------
  ThreadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: factorial-threads
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: threadKey
          AttributeType: S
        - AttributeName: pullRequestKey
          AttributeType: S
        - AttributeName: sourceKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: threadKey
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: pullRequestKey-index
          KeySchema:
            - AttributeName: pullRequestKey
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: sourceKey-createdAt-index
          KeySchema:
            - AttributeName: sourceKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Artefact store: everything a run produces, under <workItemId>/<attempt>/.
  # Versioned, and no principal may delete an object or a version: retention
  # is the lifecycle rule, never a permission. Only orchestrator Lambdas and
  # the invoker write; the agent permissions boundary grants no S3 at all.
  # ---------------------------------------------------------------------------
  WorkArtefactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub factorial-work-artefacts-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtefacts
            Status: Enabled
            ExpirationInDays: !Ref ArtefactRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: RemoveExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      Tags:
        - Key: Project
          Value: Factorial

  WorkArtefactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WorkArtefactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt WorkArtefactsBucket.Arn
              - !Sub ${WorkArtefactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyDeletes
            Effect: Deny
            Principal: '*'
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub ${WorkArtefactsBucket.Arn}/*

  # Write-only: the orchestrator records artefacts but never reads them back.
  WorkArtefactsWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-work-artefacts-write
      Description: Store run artefacts. No read, list or delete.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub ${WorkArtefactsBucket.Arn}/*

  # The progress record (#15): every orchestrator Lambda and the invoker put
  # WorkItemProgress events, and only those, on the work bus.
  ProgressEventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-progress-events
      Description: Put WorkItemProgress events on the work bus. No other source.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: events:PutEvents
            Resource: !ImportValue Factorial-WorkBusArn
            Condition:
              StringEquals:
                events:source: factorial.progress

  # ---------------------------------------------------------------------------
  # Network for the Fargate invoker: public subnets, no NAT, egress only.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: factorial
        - Key: Project
          Value: Factorial

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: factorial
        - Key: Project
          Value: Factorial

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: factorial-a
        - Key: Project
          Value: Factorial

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: factorial-b
        - Key: Project
          Value: Factorial

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: factorial-public
        - Key: Project
          Value: Factorial

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # No ingress. Egress uses the VPC default allow-all rule.
  InvokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: factorial-invoker
      # Says harness, but changing a security group's description replaces it.
      GroupDescription: Factorial harness invoker tasks (egress only)
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: factorial-invoker
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # The invoker: a Fargate task that runs one agent invocation to completion.
  # Step Functions waits on it with runTask.sync, so a build may take hours
  # without any Lambda or integration time limit, and completion is observed
  # by a process the agent cannot influence.
  # ---------------------------------------------------------------------------
  BuildCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: factorial-build
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Project
          Value: Factorial

  InvokerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /factorial/invoker
      RetentionInDays: !Ref LogRetentionDays

  InvokerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-invoker-execution
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-invoker-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/factorial/invoker
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${InvokerLogGroup.Arn}:*
      Tags:
        - Key: Project
          Value: Factorial

  InvokerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-invoker
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      ManagedPolicyArns:
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-invoker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Every role on AgentCore Runtime (docs/agent-sdk-plan.md): the
              # run, attach and status actions, and which version live serves,
              # its model and its limits, for usage.json.
              - Sid: InvokeRuntimes
                Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !ImportValue Factorial-BuilderRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/*
                    - RuntimeArn: !ImportValue Factorial-BuilderRuntimeArn
                  - !ImportValue Factorial-ReviewerRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/*
                    - RuntimeArn: !ImportValue Factorial-ReviewerRuntimeArn
              - Sid: ReadRuntimeVersions
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                Resource:
                  - !ImportValue Factorial-BuilderRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/*
                    - RuntimeArn: !ImportValue Factorial-BuilderRuntimeArn
                  - !ImportValue Factorial-ReviewerRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/*
                    - RuntimeArn: !ImportValue Factorial-ReviewerRuntimeArn
              - Sid: Ledger
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt WorkItemsTable.Arn
      Tags:
        - Key: Project
          Value: Factorial

  # Every change registers a new revision, and the state machine version
  # names the revision it was published with. An execution in flight during
  # a deploy stays on its version, so the old revision must stay registered:
  # CloudFormation deregisters a replaced revision by default, and on
  # 2026-10-21 a run that started during a deploy failed at Build with
  # "TaskDefinition is inactive". Retained revisions cost nothing; the image
  # they name is kept by the repository's lifecycle rule (the last 20).
  InvokerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      Family: factorial-invoker
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt InvokerExecutionRole.Arn
      TaskRoleArn: !GetAtt InvokerTaskRole.Arn
      ContainerDefinitions:
        - Name: invoker
          Image: !Join
            - ':'
            - - !ImportValue Factorial-InvokerRepositoryUri
              - !Ref InvokerImageTag
          Essential: true
          # Time to store the transcript and usage after ECS sends SIGTERM.
          StopTimeout: 120
          # The role and its Runtime (ROLE, TARGET, RUNTIME_ARN,
          # RUNTIME_QUALIFIER) come from the state machine's container
          # overrides, so this one task definition serves every agent role.
          Environment:
            - Name: TABLE_NAME
              Value: !Ref WorkItemsTable
            - Name: EVENT_BUS_NAME
              Value: !ImportValue Factorial-WorkBusName
            - Name: ARTEFACT_BUCKET
              Value: !Ref WorkArtefactsBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref InvokerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: invoker
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Lambda steps around the agent. Each has only the permissions its step needs.
  # ---------------------------------------------------------------------------
  IntakeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-intake
      RetentionInDays: !Ref LogRetentionDays
  PrepareLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-prepare
      RetentionInDays: !Ref LogRetentionDays
  PrepareReviewLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-prepare-review
      RetentionInDays: !Ref LogRetentionDays
  ContinueBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-continue-build
      RetentionInDays: !Ref LogRetentionDays
  CollectReviewLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-collect-review
      RetentionInDays: !Ref LogRetentionDays
  CollectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-collect
      RetentionInDays: !Ref LogRetentionDays
  DispatchTestsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-dispatch-tests
      RetentionInDays: !Ref LogRetentionDays
  OpenPullRequestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-open-pr
      RetentionInDays: !Ref LogRetentionDays
  ReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-report
      RetentionInDays: !Ref LogRetentionDays
  NotifyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-notify
      RetentionInDays: !Ref LogRetentionDays

  # Reads GitHub with read-only tokens, and answers a refusal on the pull
  # request when a person asked. Touches no session.
  IntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-intake
      Description: Accept a WorkItem once, resolve its thread and choose its route.
      CodeUri: ../packages/orchestration/dist/intake/
      Handler: index.handler
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref IntakeLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # Resume reads the turns on the newest thread a source opened.
            - Sid: LedgerThreadIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${WorkItemsTable.Arn}/index/threadKey-createdAt-index
            - Sid: Threads
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ThreadsTable.Arn
            - Sid: ThreadIndexes
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub ${ThreadsTable.Arn}/index/pullRequestKey-index
                - !Sub ${ThreadsTable.Arn}/index/sourceKey-createdAt-index
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  PrepareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-prepare
      Description: Clone the repository into the builder's session on the thread's branch and seed it.
      CodeUri: ../packages/orchestration/dist/prepare/
      Handler: index.handler
      Timeout: 900
      LoggingConfig:
        LogGroup: !Ref PrepareLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref SessionCommandPolicy
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  CollectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-collect
      Description: Store the session's files and the builder's plan, commit leftovers, push the work branch and collect the agent's summary.
      CodeUri: ../packages/orchestration/dist/collect/
      Handler: index.handler
      Timeout: 900
      MemorySize: 1024
      LoggingConfig:
        LogGroup: !Ref CollectLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref SessionCommandPolicy
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  DispatchTestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-dispatch-tests
      Description: Start the repository's test workflow on the work branch with a task token.
      CodeUri: ../packages/orchestration/dist/dispatch-tests/
      Handler: index.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref DispatchTestsLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref GitHubAppPolicy
        - !Ref ProgressEventsPolicy

  # Reads back the validated plan files, the one exception to the artefact
  # store being write-only: the builder's copy is in a session treated as
  # hostile, so the stored copy, validated by Collect, is the only one no
  # agent has touched since. Only these two keys are readable.
  PrepareReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-prepare-review
      Description: Set up a fresh reviewer session at the tested commit with the plan, the summary and the diff.
      CodeUri: ../packages/orchestration/dist/prepare-review/
      Handler: index.handler
      Timeout: 900
      LoggingConfig:
        LogGroup: !Ref PrepareReviewLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            - Sid: ReadPlanArtefacts
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.json
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.md
        - !Ref SessionCommandPolicy
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  ContinueBuildFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-continue-build
      Description: Start the next build round in a fresh builder session, from the branch, the plan and the previous round's notes.
      CodeUri: ../packages/orchestration/dist/continue-build/
      Handler: index.handler
      Timeout: 900
      LoggingConfig:
        LogGroup: !Ref ContinueBuildLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # The read exceptions to the write-only store: the validated plan
            # and the previous round's notes, which Collect stored before the push.
            - Sid: ReadRoundArtefacts
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.json
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.md
                - !Sub ${WorkArtefactsBucket.Arn}/*/build/notes.md
        - !Ref SessionCommandPolicy
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  CollectReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-collect-review
      Description: Read and validate the reviewer's review, add findings for sensitive changes, and store it.
      CodeUri: ../packages/orchestration/dist/collect-review/
      Handler: index.handler
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref CollectReviewLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref SessionCommandPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  OpenPullRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-open-pr
      Description: Open the pull request for human approval and notify the requester.
      CodeUri: ../packages/orchestration/dist/open-pr/
      Handler: index.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref OpenPullRequestLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # The pull request on its thread, so later turns on it find the branch.
            - Sid: Threads
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ThreadsTable.Arn
            # The full plan, for the pull request's step list: the state carries only a shortened copy.
            - Sid: ReadPlanArtefacts
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.json
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-report
      Description: Tell the requester when no pull request will follow.
      CodeUri: ../packages/orchestration/dist/report/
      Handler: index.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref ReportLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  # The notifier seam (#205): reached by ProgressNotifyRule, it dispatches on
  # the event's source type to one notifier per type. It records that a notice
  # was sent on the ledger row and speaks through the App token (issues: write,
  # one repository). It reads no artefact and puts no event.
  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-notify
      Description: Tell the requester that their work has started.
      CodeUri: ../packages/orchestration/dist/notify/
      Handler: index.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref NotifyLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref GitHubAppPolicy
        # Where a failed invocation's event goes (NotifyFunctionInvokeConfig).
        - Statement:
            - Sid: FailedNotices
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt NotifyFailedQueue.Arn

  # Covers the reviewer's sessions as well as the builder's. The description
  # still names only the builder: changing a managed policy's description
  # replaces it, and the replacement collides with the fixed name.
  SessionCommandPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-session-command
      # Out of date (it covers every role's session now) but kept: IAM cannot
      # change a policy's description in place, so editing it replaces the
      # policy, and the fixed name makes the replacement fail (#130's deploy).
      Description: Run deterministic commands in the builder harness session.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Each role's Runtime (the builder's also holds its clean room):
          # commands only, since the invoker runs the agent.
          - Effect: Allow
            Action:
              - bedrock-agentcore:InvokeAgentRuntimeCommand
            Resource:
              - !ImportValue Factorial-BuilderRuntimeArn
              - !Sub
                - ${RuntimeArn}/runtime-endpoint/*
                - RuntimeArn: !ImportValue Factorial-BuilderRuntimeArn
              - !ImportValue Factorial-ReviewerRuntimeArn
              - !Sub
                - ${RuntimeArn}/runtime-endpoint/*
                - RuntimeArn: !ImportValue Factorial-ReviewerRuntimeArn

  # Only orchestrator functions, outside the agent sandbox, may read the App
  # key and mint tokens.
  GitHubAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-github-app
      Description: Read the GitHub App identifiers and private key to mint installation tokens.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/factorial/github/*
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:factorial/github/app-private-key-*

  # ---------------------------------------------------------------------------
  # Test callback: the dispatched workflow reports its result with the task
  # token through this role. The workflow is dispatched on the default branch
  # (its definition is trusted; the work commit is checked out as data in a
  # credential-less job), so the trust is for that branch only, and the role
  # can only send task results.
  # ---------------------------------------------------------------------------
  TestCallbackRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-test-callback
      Description: Assumed by the dispatched test workflow to report its result to Step Functions.
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !ImportValue Factorial-GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - ${Prefix}:ref:refs/heads/${DefaultBranch}
                  - Prefix: !ImportValue Factorial-GitHubOidcSubjectPrefix
      Policies:
        - PolicyName: factorial-test-callback
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                  - states:SendTaskHeartbeat
                Resource: '*'
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # The state machine. Deterministic; the agent runs inside the Build state.
  # ---------------------------------------------------------------------------
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/factorial-work
      RetentionInDays: !Ref LogRetentionDays

  OrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-orchestrator
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-orchestrator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeSteps
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Ref IntakeFunction.Alias
                  - !Ref PrepareFunction.Alias
                  - !Ref CollectFunction.Alias
                  - !Ref ContinueBuildFunction.Alias
                  - !Ref DispatchTestsFunction.Alias
                  - !Ref PrepareReviewFunction.Alias
                  - !Ref CollectReviewFunction.Alias
                  - !Ref OpenPullRequestFunction.Alias
                  - !Ref ReportFunction.Alias
              - Sid: RunInvoker
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/factorial-invoker:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt BuildCluster.Arn
              - Sid: TrackInvoker
                Effect: Allow
                Action:
                  - ecs:StopTask
                  - ecs:DescribeTasks
                Resource: '*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt BuildCluster.Arn
              - Sid: PassInvokerRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt InvokerExecutionRole.Arn
                  - !GetAtt InvokerTaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ManagedRuleForSyncTasks
                Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule
              - Sid: ExecutionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
      Tags:
        - Key: Project
          Value: Factorial

  WorkStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: factorial-work
      StateMachineType: STANDARD
      RoleArn: !GetAtt OrchestratorRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionSubstitutions:
        FactorialVersion: !Ref FactorialVersion
        BuildTimeoutSeconds: !Ref BuildTimeoutSeconds
        MaxBuildRounds: !FindInMap [Builder, MaxRounds, Value]
        TestTimeoutSeconds: !Ref TestTimeoutSeconds
        ReviewTimeoutSeconds: !Ref ReviewTimeoutSeconds
        IntakeFunctionAlias: !Ref IntakeFunction.Alias
        PrepareFunctionAlias: !Ref PrepareFunction.Alias
        CollectFunctionAlias: !Ref CollectFunction.Alias
        ContinueBuildFunctionAlias: !Ref ContinueBuildFunction.Alias
        DispatchTestsFunctionAlias: !Ref DispatchTestsFunction.Alias
        PrepareReviewFunctionAlias: !Ref PrepareReviewFunction.Alias
        CollectReviewFunctionAlias: !Ref CollectReviewFunction.Alias
        OpenPullRequestFunctionAlias: !Ref OpenPullRequestFunction.Alias
        ReportFunctionAlias: !Ref ReportFunction.Alias
        ClusterArn: !GetAtt BuildCluster.Arn
        TaskDefinitionArn: !Ref InvokerTaskDefinition
        BuilderRuntimeArn: !ImportValue Factorial-BuilderRuntimeArn
        ReviewerRuntimeArn: !ImportValue Factorial-ReviewerRuntimeArn
        SubnetA: !Ref SubnetA
        SubnetB: !Ref SubnetB
        SecurityGroup: !Ref InvokerSecurityGroup
      DefinitionString: |
        {
          "Comment": "Factorial: intake -> build (planning first) -> test -> review -> PR. Deterministic; Intake chooses the route from a fixed set, and the agents run inside Build and Review.",
          "QueryLanguage": "JSONata",
          "StartAt": "Start",
          "States": {
            "Start": {
              "Type": "Pass",
              "Assign": {
                "workItemInput": "{% $states.input %}",
                "intake": null,
                "ctx": null,
                "collect": null,
                "test": null,
                "failure": null,
                "plan": null,
                "buildRound": 1,
                "buildSession": null,
                "buildStart": null,
                "reviewPrep": null,
                "reviewError": null,
                "review": null
              },
              "Output": { "workItemId": "{% $states.input.id %}" },
              "Next": "Intake"
            },
            "Intake": {
              "Type": "Task",
              "Comment": "Accept the WorkItem once, resolve its thread and choose its route. A refusal is recorded, and answered on the pull request when a person asked.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${IntakeFunctionAlias}",
                "Payload": {
                  "workItem": "{% $workItemInput %}",
                  "factorialVersion": "${FactorialVersion}",
                  "executionArn": "{% $states.context.Execution.Id %}",
                  "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" }
                }
              },
              "Assign": { "intake": "{% $states.result.Payload %}" },
              "Output": {
                "workItemId": "{% $workItemInput.id %}",
                "attempt": "{% $states.result.Payload.attempt %}",
                "route": "{% $states.result.Payload.route %}",
                "threadKey": "{% $exists($states.result.Payload.threadKey) ? $states.result.Payload.threadKey : null %}"
              },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["DuplicateWorkItem"], "Output": { "workItemId": "{% $workItemInput.id %}", "error": "{% $states.errorOutput %}" }, "Next": "Duplicate" },
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $workItemInput.id %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Route"
            },
            "Route": {
              "Type": "Choice",
              "Comment": "The route Intake chose, from the enum in contracts/intake/v1. Anything but change runs nothing further.",
              "Choices": [ { "Condition": "{% $intake.route = 'change' %}", "Next": "Prepare" } ],
              "Default": "NotAdmitted"
            },
            "Prepare": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${PrepareFunctionAlias}",
                "Payload": {
                  "workItem": "{% $workItemInput %}",
                  "factorialVersion": "${FactorialVersion}",
                  "intake": "{% $intake %}",
                  "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" }
                }
              },
              "Assign": { "ctx": "{% $states.result.Payload %}", "buildSession": "{% $states.result.Payload.sessionId %}" },
              "Output": {
                "workItemId": "{% $states.result.Payload.workItem.id %}",
                "attempt": "{% $states.result.Payload.attempt %}",
                "branch": "{% $states.result.Payload.branch %}"
              },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $workItemInput.id %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Build"
            },
            "Duplicate": { "Type": "Succeed", "Comment": "This WorkItem was already accepted; nothing to do." },
            "NotAdmitted": { "Type": "Succeed", "Comment": "Intake refused the item: its pull request is not Factorial's or no longer on its branch, another turn holds the thread, or failed checks reached their limit. Intake recorded why and replied on the pull request when a person asked." },
            "Build": {
              "Type": "Task",
              "Resource": "arn:aws:states:::ecs:runTask.sync",
              "Arguments": {
                "Cluster": "${ClusterArn}",
                "TaskDefinition": "${TaskDefinitionArn}",
                "LaunchType": "FARGATE",
                "PropagateTags": "TASK_DEFINITION",
                "NetworkConfiguration": {
                  "AwsvpcConfiguration": {
                    "Subnets": ["${SubnetA}", "${SubnetB}"],
                    "SecurityGroups": ["${SecurityGroup}"],
                    "AssignPublicIp": "ENABLED"
                  }
                },
                "Overrides": {
                  "ContainerOverrides": [
                    {
                      "Name": "invoker",
                      "Environment": [
                        { "Name": "ROLE", "Value": "builder" },
                        { "Name": "STAGE", "Value": "{% $states.context.State.Name %}" },
                        { "Name": "RUNTIME_ARN", "Value": "${BuilderRuntimeArn}" },
                        { "Name": "RUNTIME_QUALIFIER", "Value": "live" },
                        { "Name": "BUILD_ROUND", "Value": "{% $string($buildRound) %}" },
                        { "Name": "WORK_ITEM_ID", "Value": "{% $ctx.workItem.id %}" },
                        { "Name": "SESSION_ID", "Value": "{% $buildSession %}" },
                        { "Name": "BRANCH", "Value": "{% $ctx.branch %}" },
                        { "Name": "BASE_BRANCH", "Value": "{% $ctx.baseBranch %}" },
                        { "Name": "BASE_COMMIT", "Value": "{% $ctx.baseCommit %}" }
                      ]
                    }
                  ]
                }
              },
              "TimeoutSeconds": ${BuildTimeoutSeconds},
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "taskArn": "{% $states.result.TaskArn %}" },
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "SaveWork" }
              ],
              "Next": "Collect"
            },
            "SaveWork": {
              "Type": "Task",
              "Comment": "The build stopped. Push whatever the agent committed, and anything it left uncommitted, so the work is not lost. If the builder merely ran out of steps or time, the build continues in a fresh session; otherwise the failure is reported, with no tests and no pull request.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": { "FunctionName": "${CollectFunctionAlias}", "Payload": "{% $merge([$ctx, { 'salvage': true, 'builderSessionId': $buildSession, 'roundStart': $buildStart, 'failure': $failure, 'progress': { 'stage': $states.context.State.Name, 'round': $buildRound } }]) %}" },
              "Assign": { "collect": "{% $states.result.Payload %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "collect": "{% $states.result.Payload %}" },
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "BuildIncomplete"
            },
            "BuildIncomplete": {
              "Type": "Choice",
              "Comment": "A builder that stopped at its own limit gets another session, up to MaxBuildRounds; any other failure, or the last round, is reported.",
              "Choices": [ { "Condition": "{% $collect.incomplete = true and $buildRound < ${MaxBuildRounds} %}", "Next": "ContinueBuild" } ],
              "Default": "ReportFailure"
            },
            "ContinueBuild": {
              "Type": "Task",
              "Comment": "Seed a fresh builder session from the branch with the plan and the previous round's notes, then run the builder again.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ContinueBuildFunctionAlias}",
                "Payload": { "ctx": "{% $ctx %}", "round": "{% $buildRound + 1 %}", "collect": "{% $collect %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Assign": {
                "buildSession": "{% $states.result.Payload.sessionId %}",
                "buildRound": "{% $states.result.Payload.round %}",
                "buildStart": "{% $states.result.Payload.roundStart %}",
                "failure": null,
                "collect": null
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "buildRound": "{% $states.result.Payload.round %}", "buildSession": "{% $states.result.Payload.sessionId %}" },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Build"
            },
            "Collect": {
              "Type": "Task",
              "Comment": "Read and validate the builder's plan, then push its work. A build that ends without a valid plan pushes nothing and is reported as invalid-plan.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": { "FunctionName": "${CollectFunctionAlias}", "Payload": "{% $merge([$ctx, { 'builderSessionId': $buildSession, 'roundStart': $buildStart, 'progress': { 'stage': $states.context.State.Name, 'round': $buildRound } }]) %}" },
              "Assign": { "collect": "{% $states.result.Payload %}", "plan": "{% $exists($states.result.Payload.plan) ? $states.result.Payload.plan : null %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "collect": "{% $states.result.Payload %}" },
              "Catch": [
                { "ErrorEquals": ["InvalidPlan"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportInvalidPlan" },
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "HasChanges"
            },
            "HasChanges": {
              "Type": "Choice",
              "Choices": [ { "Condition": "{% $collect.pushed = true %}", "Next": "Test" } ],
              "Default": "ReportNoChanges"
            },
            "Test": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
              "Arguments": {
                "FunctionName": "${DispatchTestsFunctionAlias}",
                "Payload": { "taskToken": "{% $states.context.Task.Token %}", "ctx": "{% $ctx %}", "collect": "{% $collect %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "TimeoutSeconds": ${TestTimeoutSeconds},
              "Assign": { "test": "{% $states.result %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "test": "{% $states.result %}" },
              "Catch": [
                { "ErrorEquals": ["TestsFailed"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportTestsFailed" },
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "PrepareReview"
            },
            "PrepareReview": {
              "Type": "Task",
              "Comment": "Set up a fresh reviewer session at the tested commit. The review is advisory: if any review step fails, the pull request still opens, saying the review did not complete.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${PrepareReviewFunctionAlias}",
                "Payload": { "ctx": "{% $ctx %}", "collect": "{% $collect %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Assign": { "reviewPrep": "{% $states.result.Payload %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "sensitive": "{% $states.result.Payload.sensitivePathsJson %}" },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "OpenPullRequest" }
              ],
              "Next": "Review"
            },
            "Review": {
              "Type": "Task",
              "Comment": "The reviewer judges the change in its own session and writes review.json. Nothing from its session is pushed. A failed run still goes to CollectReview, which may find a review.",
              "Resource": "arn:aws:states:::ecs:runTask.sync",
              "Arguments": {
                "Cluster": "${ClusterArn}",
                "TaskDefinition": "${TaskDefinitionArn}",
                "LaunchType": "FARGATE",
                "PropagateTags": "TASK_DEFINITION",
                "NetworkConfiguration": {
                  "AwsvpcConfiguration": {
                    "Subnets": ["${SubnetA}", "${SubnetB}"],
                    "SecurityGroups": ["${SecurityGroup}"],
                    "AssignPublicIp": "ENABLED"
                  }
                },
                "Overrides": {
                  "ContainerOverrides": [
                    {
                      "Name": "invoker",
                      "Environment": [
                        { "Name": "ROLE", "Value": "reviewer" },
                        { "Name": "STAGE", "Value": "{% $states.context.State.Name %}" },
                        { "Name": "RUNTIME_ARN", "Value": "${ReviewerRuntimeArn}" },
                        { "Name": "RUNTIME_QUALIFIER", "Value": "live" },
                        { "Name": "SENSITIVE_PATHS", "Value": "{% $reviewPrep.sensitivePathsJson %}" },
                        { "Name": "WORK_ITEM_ID", "Value": "{% $ctx.workItem.id %}" },
                        { "Name": "SESSION_ID", "Value": "{% $ctx.sessionId %}" },
                        { "Name": "BRANCH", "Value": "{% $ctx.branch %}" },
                        { "Name": "BASE_BRANCH", "Value": "{% $ctx.baseBranch %}" },
                        { "Name": "BASE_COMMIT", "Value": "{% $ctx.baseCommit %}" }
                      ]
                    }
                  ]
                }
              },
              "TimeoutSeconds": ${ReviewTimeoutSeconds},
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "taskArn": "{% $states.result.TaskArn %}" },
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "reviewError": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "CollectReview" }
              ],
              "Next": "CollectReview"
            },
            "CollectReview": {
              "Type": "Task",
              "Comment": "Validate the review, add findings for sensitive changes and store it. A missing or invalid review is stored as review/error.json and the run continues.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${CollectReviewFunctionAlias}",
                "Payload": { "ctx": "{% $ctx %}", "sensitive": "{% $reviewPrep.sensitive %}", "reviewError": "{% $reviewError %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Assign": { "review": "{% $states.result.Payload %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "reviewed": "{% $states.result.Payload.ok %}" },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "OpenPullRequest" }
              ],
              "Next": "OpenPullRequest"
            },
            "OpenPullRequest": {
              "Type": "Task",
              "Comment": "Opens the pull request; for a rework item, replies on its existing pull request instead.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${OpenPullRequestFunctionAlias}",
                "Payload": { "ctx": "{% $ctx %}", "collect": "{% $collect %}", "test": "{% $test %}", "plan": "{% $plan %}", "review": "{% $review %}", "prFacts": "{% $exists($reviewPrep.prFacts) ? $reviewPrep.prFacts : null %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "prNumber": "{% $states.result.Payload.prNumber %}", "prUrl": "{% $states.result.Payload.prUrl %}" },
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Done"
            },
            "Done": { "Type": "Succeed" },
            "ReportNoChanges": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "no-changes", "ctx": "{% $ctx %}", "summary": "{% $collect.summary %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "no-changes" },
              "Next": "NoChanges"
            },
            "NoChanges": { "Type": "Succeed", "Comment": "The agent made no changes; the requester was told." },
            "ReportTestsFailed": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "tests-failed", "ctx": "{% $ctx %}", "error": "{% $failure %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "tests-failed" },
              "Next": "TestsFailed"
            },
            "TestsFailed": { "Type": "Fail", "Error": "TestsFailed", "Cause": "The change did not pass the repository's checks." },
            "ReportInvalidPlan": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "invalid-plan", "ctx": "{% $ctx %}", "error": "{% $failure %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "invalid-plan" },
              "Catch": [ { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "invalid-plan", "error": "{% $states.errorOutput %}" }, "Next": "InvalidPlan" } ],
              "Next": "InvalidPlan"
            },
            "InvalidPlan": { "Type": "Fail", "Error": "InvalidPlan", "Cause": "The builder did not produce a valid plan; the requester was told." },
            "ReportFailure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "failed", "ctx": "{% $ctx %}", "workItem": "{% $workItemInput %}", "error": "{% $failure %}", "saved": "{% $collect %}", "buildRound": "{% $buildRound %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $workItemInput.id %}", "attempt": "{% $exists($ctx.attempt) ? $ctx.attempt : null %}", "status": "failed" },
              "Catch": [ { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $workItemInput.id %}", "attempt": "{% $exists($ctx.attempt) ? $ctx.attempt : null %}", "status": "failed", "error": "{% $states.errorOutput %}" }, "Next": "Failed" } ],
              "Next": "Failed"
            },
            "Failed": { "Type": "Fail", "Error": "WorkItemFailed", "Cause": "A step failed; see the execution history and the requester's issue." }
          }
        }
      Tags:
        - Key: Project
          Value: Factorial

  # Each definition change publishes an immutable version; the live alias is
  # moved to it at deploy time. Separate promotion for the state machine comes
  # with the staging canary (see CLAUDE.md, known gaps).
  WorkStateMachineVersion:
    Type: AWS::StepFunctions::StateMachineVersion
    Properties:
      StateMachineArn: !Ref WorkStateMachine
      StateMachineRevisionId: !GetAtt WorkStateMachine.StateMachineRevisionId
      Description: !Sub Factorial ${FactorialVersion}

  WorkStateMachineLiveAlias:
    Type: AWS::StepFunctions::StateMachineAlias
    Properties:
      Name: live
      Description: The state machine version handling new WorkItems.
      RoutingConfiguration:
        - StateMachineVersionArn: !Ref WorkStateMachineVersion
          Weight: 100

  # ---------------------------------------------------------------------------
  # The one rule: every WorkItem on the bus starts an execution on the live
  # alias. In-flight executions finish on the version they started with.
  # ---------------------------------------------------------------------------
  WorkStarterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-work-starter
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-work-starter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource:
                  - !Ref WorkStateMachine
                  - !Ref WorkStateMachineLiveAlias
      Tags:
        - Key: Project
          Value: Factorial

  WorkItemRule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-work-item
      Description: Start the Factorial state machine for every WorkItem.
      EventBusName: !ImportValue Factorial-WorkBusName
      State: ENABLED
      EventPattern:
        source:
          - factorial.triggers
        detail-type:
          - WorkItem
      Targets:
        - Id: start-work
          Arn: !Ref WorkStateMachineLiveAlias
          RoleArn: !GetAtt WorkStarterRole.Arn
          InputPath: $.detail

  # Only the events a notifier acts on go to it: today a round-1 Build start
  # (`round` is recorded from round 2), the one event githubIssueNotifier acts
  # on. The rule is a filter for cost; the notifier module stays the decision
  # and keeps the same checks. A notifier that acts on other events widens
  # this pattern in the same change (see notifiers/index.ts).
  ProgressNotifyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-progress-notify
      Description: Route the round-1 Build start of each work item to the notifier.
      EventBusName: !ImportValue Factorial-WorkBusName
      State: ENABLED
      EventPattern:
        source:
          - factorial.progress
        detail-type:
          - WorkItemProgress
        detail:
          stage:
            - Build
          transition:
            - started
          round:
            - exists: false
      Targets:
        - Id: notify
          Arn: !Ref NotifyFunction.Alias
          DeadLetterConfig:
            Arn: !GetAtt NotifyFailedQueue.Arn

  NotifyFunctionRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotifyFunction.Alias
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProgressNotifyRule.Arn

  # Notices that failed: the function erred after Lambda's retries, or
  # EventBridge could not deliver to it. Each message is the progress event
  # (metadata only; no content). Nothing reads the queue yet; alarms are #16.
  NotifyFailedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: factorial-notify-failed
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  # Only the rule may put delivery failures here. The function's role carries
  # its own sqs:SendMessage for the invoke config's OnFailure destination.
  NotifyFailedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotifyFailedQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RuleDeadLetters
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotifyFailedQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ProgressNotifyRule.Arn

  # EventBridge invokes the function asynchronously: after two retries, or an
  # event older than an hour, the event goes to the failed-notice queue.
  NotifyFunctionInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: NotifyFunctionAliaslive
    Properties:
      FunctionName: !Ref NotifyFunction
      Qualifier: live
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt NotifyFailedQueue.Arn

Outputs:
  WorkStateMachineArn:
    Value: !Ref WorkStateMachine
    Export:
      Name: Factorial-WorkStateMachineArn
  WorkStateMachineLiveAliasArn:
    Value: !Ref WorkStateMachineLiveAlias
    Export:
      Name: Factorial-WorkStateMachineLiveAliasArn
  TestCallbackRoleArn:
    Description: Store as the AWS_TEST_CALLBACK_ROLE_ARN repository secret.
    Value: !GetAtt TestCallbackRole.Arn
  WorkItemsTableName:
    Value: !Ref WorkItemsTable
    Export:
      Name: Factorial-WorkItemsTableName
  ThreadsTableName:
    Value: !Ref ThreadsTable
  BuildClusterArn:
    Value: !GetAtt BuildCluster.Arn
  WorkArtefactsBucketName:
    Value: !Ref WorkArtefactsBucket
    Export:
      Name: Factorial-WorkArtefactsBucketName
