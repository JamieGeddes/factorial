AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Factorial orchestration: the work ledger, the Step Functions state machine
  (plan -> build -> verify -> review -> PR) with its live alias, the rule that starts it from the
  work bus, the Fargate invoker that runs the agents, and the Lambda steps
  around the agent. Deployed by GitHub Actions.

Parameters:
  InvokerImageTag:
    Type: String
    Description: Tag of the invoker image in the factorial/invoker repository.
    AllowedPattern: '^[A-Za-z0-9._-]+$'
  AgentRuntimeImageTag:
    Type: String
    Description: Tag of the agent image in the factorial/agent-runtime repository, which the verifier tasks run.
    AllowedPattern: '^[A-Za-z0-9._-]+$'
  OrchestrationImageTag:
    Type: String
    Description: Tag of the orchestration image (the functions that run git) in the factorial/orchestration repository.
    AllowedPattern: '^[A-Za-z0-9._-]+$'
  FactorialVersion:
    Type: String
    Description: Git commit of Factorial being deployed. Stamped on every WorkItem it handles.
    AllowedPattern: '^[0-9a-f]{7,40}$'
  ReviewTimeoutSeconds:
    Type: Number
    Default: 1200
    Description: Upper bound for one reviewer run, above the reviewer host's own time limit (FACTORIAL_MAX_DURATION_SECONDS, 900).
  BuildTimeoutSeconds:
    Type: Number
    Default: 7200
    Description: Upper bound for one round of the agent build step, including the builder host's own time limit (FACTORIAL_MAX_DURATION_SECONDS).
  LogRetentionDays:
    Type: Number
    Default: 30
  ArtefactRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: Days a run's artefacts are kept before the lifecycle rule expires them.

# Settings changed only by a pull request. A parameter would not do: the
# deploy keeps a stack's existing parameter values, so a changed Default
# never takes effect.
Mappings:
  Builder:
    # How many builder sessions one work item may use before an unfinished
    # build is reported as incomplete. Each round is a fresh session that
    # continues from the branch and the builder's notes. 3 since the spike
    # (docs/harness-vs-runtime.md, Spike results): no successful item on the
    # Runtime needed a second round.
    MaxRounds:
      Value: 3

# Runtime and Handler are set on each zip function, not here: SAM would put
# them on Collect too, which runs from the orchestration image and may have
# neither.
Globals:
  Function:
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 300
    AutoPublishAlias: live
    PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        TABLE_NAME: !Ref WorkItemsTable
        THREADS_TABLE_NAME: !Ref ThreadsTable
        EVENT_BUS_NAME: !ImportValue Factorial-WorkBusName
        ARTEFACT_BUCKET: !Ref WorkArtefactsBucket
        RUNTIME_QUALIFIER: live
        BUILDER_RUNTIME_ARN: !ImportValue Factorial-BuilderRuntimeArn
        REVIEWER_RUNTIME_ARN: !ImportValue Factorial-ReviewerRuntimeArn
        GITHUB_APP_ID_PARAM: /factorial/github/app-id
        GITHUB_INSTALLATION_ID_PARAM: /factorial/github/installation-id
        GITHUB_PRIVATE_KEY_SECRET: factorial/github/app-private-key
    Tags:
      Project: Factorial

Resources:
  # ---------------------------------------------------------------------------
  # Ledger: one row per WorkItem. Also the idempotency guard against duplicate
  # deliveries, since EventBridge cannot name executions. The thread index
  # lists the turns in one thread (#163); Intake reads it to resume an attempt
  # that failed after saving its work. The group and parent indexes list the
  # items one trigger produced (WorkItem `group`) and the items a parent
  # emitted (`parentId`); both are sparse, holding only items with that field.
  # A table update can add or delete only one index, so each index change
  # needs its own deploy.
  # ---------------------------------------------------------------------------
  WorkItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: factorial-work-items
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: workItemId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: parentId
          AttributeType: S
        - AttributeName: threadKey
          AttributeType: S
      KeySchema:
        - AttributeName: workItemId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: groupId-createdAt-index
          KeySchema:
            - AttributeName: groupId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - groupSize
              - groupIndex
              - parentId
        - IndexName: parentId-createdAt-index
          KeySchema:
            - AttributeName: parentId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - groupId
              - groupIndex
        - IndexName: threadKey-createdAt-index
          KeySchema:
            - AttributeName: threadKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - route
              - sourceKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Threads (#163): one row per branch Factorial works on, the unit of
  # continuity. Intake resolves every item to a thread and admits it with a
  # conditional write on the row: which turn holds the thread, and how many
  # automatic reworks have run since a person last asked. Pointers and counts
  # only, never content. A pull request maps to its thread through the
  # pull request index, a request to the threads it opened through the
  # source index; both are sparse and project only the key.
  # ---------------------------------------------------------------------------
  ThreadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: factorial-threads
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: threadKey
          AttributeType: S
        - AttributeName: pullRequestKey
          AttributeType: S
        - AttributeName: sourceKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: threadKey
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: pullRequestKey-index
          KeySchema:
            - AttributeName: pullRequestKey
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: sourceKey-createdAt-index
          KeySchema:
            - AttributeName: sourceKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Artefact store: everything a run produces, under <workItemId>/<attempt>/.
  # Versioned, and no principal may delete an object or a version: retention
  # is the lifecycle rule, never a permission. Only orchestrator Lambdas and
  # the invoker write; the agent permissions boundary grants no S3 at all.
  # ---------------------------------------------------------------------------
  WorkArtefactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub factorial-work-artefacts-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtefacts
            Status: Enabled
            ExpirationInDays: !Ref ArtefactRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: RemoveExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      Tags:
        - Key: Project
          Value: Factorial

  WorkArtefactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WorkArtefactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt WorkArtefactsBucket.Arn
              - !Sub ${WorkArtefactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyDeletes
            Effect: Deny
            Principal: '*'
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub ${WorkArtefactsBucket.Arn}/*

  # Write-only: the orchestrator records artefacts but never reads them back.
  WorkArtefactsWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-work-artefacts-write
      Description: Store run artefacts. No read, list or delete.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub ${WorkArtefactsBucket.Arn}/*

  # ---------------------------------------------------------------------------
  # Transfer bucket (#262): how the repository reaches a session or a verifier
  # task without either reaching GitHub. Prepare, ContinueBuild and
  # PrepareReview write a git bundle here (lib/repo-seed.ts) and pass the
  # session a presigned GET that expires in five minutes, and delete the
  # object once the session has it. PrepareVerify passes its verifier task a
  # URL that expires in fifteen, and CollectVerifier deletes the object once
  # the task has ended. Separate from the artefact store, which is write-once,
  # delete-denied and read by no session: this one is ephemeral, unversioned
  # and read only through those URLs, signed by the four stages' roles. Keys:
  # <workItemId>/<attempt>/<stage>/repo.bundle. No aws:SourceVpce condition
  # while the Runtimes are PUBLIC; it comes with VPC mode.
  # ---------------------------------------------------------------------------
  TransferBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub factorial-transfer-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTransfers
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: Factorial

  TransferBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TransferBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt TransferBucket.Arn
              - !Sub ${TransferBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          # Only the seeding stages' roles read a transfer object, and a
          # session reads one only through a URL one of them signed.
          - Sid: DenyReadsByOthers
            Effect: Deny
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${TransferBucket.Arn}/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  - !GetAtt PrepareFunctionRole.Arn
                  - !GetAtt ContinueBuildFunctionRole.Arn
                  - !GetAtt PrepareReviewFunctionRole.Arn
                  - !GetAtt PrepareVerifyFunctionRole.Arn

  # The seeding stages: write a bundle, presign its GET, delete it once the
  # session has it. Multipart uploads need AbortMultipartUpload on failure.
  TransferSeedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-transfer-seed
      Description: Write, presign and delete repository bundles in the transfer bucket.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
            Resource: !Sub ${TransferBucket.Arn}/*

  # The progress record (#15): every orchestrator Lambda and the invoker put
  # WorkItemProgress events, and only those, on the work bus.
  ProgressEventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-progress-events
      Description: Put WorkItemProgress events on the work bus. No other source.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: events:PutEvents
            Resource: !ImportValue Factorial-WorkBusArn
            Condition:
              StringEquals:
                events:source: factorial.progress

  # The terminal states' outcomes (#165): Intake (a refusal), Report and
  # OpenPullRequest put one Outcome event per work item. No other source.
  OutcomeEventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-outcome-events
      Description: Put Outcome events on the work bus. No other source.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: events:PutEvents
            Resource: !ImportValue Factorial-WorkBusArn
            Condition:
              StringEquals:
                events:source: factorial.outcome

  # ---------------------------------------------------------------------------
  # The live feed (#194): an AppSync Events API whose channels carry each
  # agent run's events while it runs, and each work item's progress. IAM
  # alone authorises connecting, publishing and subscribing: no API key.
  # Only the invoker and factorial-live-forward may publish; a person
  # subscribes with their own credentials (docs/finding-a-run.md, section 6).
  # No agent role can reach it: the agent boundary denies appsync:*. Here,
  # not in a later template, because the invoker's task role needs its ARN.
  # ---------------------------------------------------------------------------
  LiveApi:
    Type: AWS::AppSync::Api
    Properties:
      Name: factorial-live
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
        ConnectionAuthModes:
          - AuthType: AWS_IAM
        DefaultPublishAuthModes:
          - AuthType: AWS_IAM
        DefaultSubscribeAuthModes:
          - AuthType: AWS_IAM
      Tags:
        - Key: Project
          Value: Factorial

  # Channels: /factorial/work-items, /factorial/work-items/<workItemId> and
  # /factorial/runs/<workItemId>/<stage>/<round>.
  LiveNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt LiveApi.ApiId
      Name: factorial
      PublishAuthModes:
        - AuthType: AWS_IAM
      SubscribeAuthModes:
        - AuthType: AWS_IAM
      Tags:
        - Key: Project
          Value: Factorial

  LivePublishPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-live-publish
      Description: Publish to the live feed's namespace. No connecting or subscribing.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: appsync:EventPublish
            Resource: !GetAtt LiveNamespace.ChannelNamespaceArn

  # ---------------------------------------------------------------------------
  # Network for the Fargate invoker: public subnets, no NAT, egress only.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: factorial
        - Key: Project
          Value: Factorial

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: factorial
        - Key: Project
          Value: Factorial

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: factorial-a
        - Key: Project
          Value: Factorial

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: factorial-b
        - Key: Project
          Value: Factorial

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: factorial-public
        - Key: Project
          Value: Factorial

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # No ingress. Egress uses the VPC default allow-all rule.
  InvokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: factorial-invoker
      # Says harness, but changing a security group's description replaces it.
      GroupDescription: Factorial harness invoker tasks (egress only)
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: factorial-invoker
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # The invoker: a Fargate task that runs one agent invocation to completion.
  # Step Functions waits on it with runTask.sync, so a build may take hours
  # without any Lambda or integration time limit, and completion is observed
  # by a process the agent cannot influence.
  # ---------------------------------------------------------------------------
  BuildCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: factorial-build
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Project
          Value: Factorial

  InvokerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /factorial/invoker
      RetentionInDays: !Ref LogRetentionDays

  InvokerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-invoker-execution
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-invoker-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/factorial/invoker
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${InvokerLogGroup.Arn}:*
      Tags:
        - Key: Project
          Value: Factorial

  InvokerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-invoker
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      ManagedPolicyArns:
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy
        - !Ref LivePublishPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-invoker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Every role on AgentCore Runtime (docs/agent-sdk-plan.md): the
              # run, attach and status actions, and which version live serves,
              # its model and its limits, for usage.json.
              - Sid: InvokeRuntimes
                Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !ImportValue Factorial-BuilderRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/*
                    - RuntimeArn: !ImportValue Factorial-BuilderRuntimeArn
                  - !ImportValue Factorial-ReviewerRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/*
                    - RuntimeArn: !ImportValue Factorial-ReviewerRuntimeArn
              - Sid: ReadRuntimeVersions
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                Resource:
                  - !ImportValue Factorial-BuilderRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/*
                    - RuntimeArn: !ImportValue Factorial-BuilderRuntimeArn
                  - !ImportValue Factorial-ReviewerRuntimeArn
                  - !Sub
                    - ${RuntimeArn}/runtime-endpoint/*
                    - RuntimeArn: !ImportValue Factorial-ReviewerRuntimeArn
              - Sid: Ledger
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt WorkItemsTable.Arn
      Tags:
        - Key: Project
          Value: Factorial

  # Every change registers a new revision, and the state machine version
  # names the revision it was published with. An execution in flight during
  # a deploy stays on its version, so the old revision must stay registered:
  # CloudFormation deregisters a replaced revision by default, and on
  # 2026-10-21 a run that started during a deploy failed at Build with
  # "TaskDefinition is inactive". Retained revisions cost nothing; the image
  # they name is kept by the repository's lifecycle rule (the last 20).
  InvokerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      Family: factorial-invoker
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt InvokerExecutionRole.Arn
      TaskRoleArn: !GetAtt InvokerTaskRole.Arn
      ContainerDefinitions:
        - Name: invoker
          Image: !Join
            - ':'
            - - !ImportValue Factorial-InvokerRepositoryUri
              - !Ref InvokerImageTag
          Essential: true
          # Time to store the transcript and usage after ECS sends SIGTERM.
          StopTimeout: 120
          # The role and its Runtime (ROLE, TARGET, RUNTIME_ARN,
          # RUNTIME_QUALIFIER) come from the state machine's container
          # overrides, so this one task definition serves every agent role.
          Environment:
            - Name: TABLE_NAME
              Value: !Ref WorkItemsTable
            - Name: EVENT_BUS_NAME
              Value: !ImportValue Factorial-WorkBusName
            - Name: ARTEFACT_BUCKET
              Value: !Ref WorkArtefactsBucket
            # The live feed (#194); without these the invoker publishes nothing.
            - Name: LIVE_HTTP_DOMAIN
              Value: !GetAtt LiveApi.Dns.Http
            - Name: LIVE_REGION
              Value: !Ref AWS::Region
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref InvokerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: invoker
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # The verifier task (#167): a Fargate task that runs one of a target's
  # declared checks, from the agent image with the check runner as its
  # entrypoint (packages/agent-runtime/src/verifier/runner.ts). Step Functions
  # starts one per verifier (RunVerifier) and waits on it with runTask.sync;
  # it exits with the check's status, which CollectVerifier judges. The check
  # is untrusted code: the task role is the agent stack's
  # factorial-agent-verifier (the npm mirror only), the code arrives as a
  # bundle through a presigned URL, and the network is egress only.
  # ---------------------------------------------------------------------------
  VerifierSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: factorial-verifier
      GroupDescription: Factorial verifier tasks (egress only)
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: factorial-verifier
        - Key: Project
          Value: Factorial

  # The check's whole output, redacted line by line by the runner. CollectVerifier
  # stores the end of it in the artefact store.
  VerifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /factorial/verifier
      RetentionInDays: !Ref LogRetentionDays

  # Used by ECS to pull the image and write the log, never by the task.
  VerifierExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-verifier-execution
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-verifier-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/factorial/agent-runtime
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${VerifierLogGroup.Arn}:*
      Tags:
        - Key: Project
          Value: Factorial

  # Retained like the invoker's: an execution in flight during a deploy
  # starts its verifiers on the revision its state machine version names.
  VerifierTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      Family: factorial-verifier
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      # As much as a builder session has, so a check that passed there fits here.
      Cpu: '2048'
      Memory: '8192'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt VerifierExecutionRole.Arn
      TaskRoleArn: !ImportValue Factorial-VerifierTaskRoleArn
      ContainerDefinitions:
        - Name: verifier
          Image: !Join
            - ':'
            - - !ImportValue Factorial-AgentRuntimeRepositoryUri
              - !Ref AgentRuntimeImageTag
          Essential: true
          EntryPoint:
            - node
            - /opt/factorial/agent-runtime/verify.mjs
          # An init process as PID 1 reaps the check's children; the runner is root,
          # as the agent host is, and drops to the agent user for the check.
          LinuxParameters:
            InitProcessEnabled: true
          StopTimeout: 30
          # The verifier, the commit, the branches and the bundle URL come from
          # the state machine's container overrides.
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            # The npm mirror (#242): the runner writes a token for it to the
            # agent's ~/.npmrc and puts the registry in the check's environment,
            # and starts no check without it.
            - Name: FACTORIAL_CODEARTIFACT_DOMAIN
              Value: !ImportValue Factorial-NpmDomainName
            - Name: FACTORIAL_CODEARTIFACT_DOMAIN_OWNER
              Value: !ImportValue Factorial-NpmDomainOwner
            - Name: FACTORIAL_CODEARTIFACT_REPOSITORY
              Value: !ImportValue Factorial-NpmRepositoryName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref VerifierLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: verifier
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Lambda steps around the agent. Each has only the permissions its step needs.
  # ---------------------------------------------------------------------------
  IntakeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-intake
      RetentionInDays: !Ref LogRetentionDays
  PrepareLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-prepare
      RetentionInDays: !Ref LogRetentionDays
  PrepareReviewLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-prepare-review
      RetentionInDays: !Ref LogRetentionDays
  ContinueBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-continue-build
      RetentionInDays: !Ref LogRetentionDays
  CollectReviewLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-collect-review
      RetentionInDays: !Ref LogRetentionDays
  CollectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-collect
      RetentionInDays: !Ref LogRetentionDays
  PrepareVerifyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-prepare-verify
      RetentionInDays: !Ref LogRetentionDays
  CollectVerifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-collect-verifier
      RetentionInDays: !Ref LogRetentionDays
  OpenPullRequestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-open-pr
      RetentionInDays: !Ref LogRetentionDays
  ReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-report
      RetentionInDays: !Ref LogRetentionDays
  ReportGitHubLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-report-github
      RetentionInDays: !Ref LogRetentionDays
  ThreadOutcomeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-thread-outcome
      RetentionInDays: !Ref LogRetentionDays
  ThreadReconcileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-thread-reconcile
      RetentionInDays: !Ref LogRetentionDays
  LiveForwardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/factorial-live-forward
      RetentionInDays: !Ref LogRetentionDays

  # Reads GitHub with read-only tokens and acknowledges a comment turn with a
  # reaction. A refusal ends the turn with an outcome, which the reporter
  # answers. Touches no session.
  IntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-intake
      Description: Accept a WorkItem once, resolve its thread and choose its route.
      CodeUri: ../packages/orchestration/dist/intake/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref IntakeLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # Resume reads the turns on the newest thread a source opened.
            - Sid: LedgerThreadIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${WorkItemsTable.Arn}/index/threadKey-createdAt-index
            - Sid: Threads
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ThreadsTable.Arn
            - Sid: ThreadIndexes
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub ${ThreadsTable.Arn}/index/pullRequestKey-index
                - !Sub ${ThreadsTable.Arn}/index/sourceKey-createdAt-index
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy
        - !Ref OutcomeEventsPolicy

  # Prepare, ContinueBuild and PrepareReview seed their session from a git
  # bundle they fetch themselves (lib/repo-seed.ts, #262), so they run from
  # the orchestration image, which has git, with room in memory and /tmp for
  # the bare repository and the bundle. As for Collect, an image function
  # cannot keep a zip function's name, so each has a new one; their logs stay
  # in their old log groups.
  PrepareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-prepare-seed
      Description: Seed the builder's session with the repository, from a bundle, on the thread's branch.
      PackageType: Image
      ImageUri: !Sub
        - ${RepositoryUri}:${OrchestrationImageTag}
        - RepositoryUri: !ImportValue Factorial-OrchestrationRepositoryUri
      ImageConfig:
        Command:
          - prepare/index.handler
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          TRANSFER_BUCKET: !Ref TransferBucket
      LoggingConfig:
        LogGroup: !Ref PrepareLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # An approval's session is seeded with the plan.json its proposal showed (#169); plan.md is rendered from it.
            - Sid: ReadPlanArtefacts
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.json
        - !Ref SessionCommandPolicy
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref TransferSeedPolicy
        - !Ref ProgressEventsPolicy

  # Collect is the clean room: it pushes from a pristine clone in its own
  # /tmp (lib/clean-room.ts), so it runs from the orchestration image, which
  # has git. 2 GB of memory and of /tmp is generous for repositories under
  # 100 MB of history; the blob-less bare clone keeps the working set small.
  # A function cannot change from a zip to an image in place, and
  # CloudFormation cannot replace a function that keeps its name, so the image
  # function has its own; its logs stay in /aws/lambda/factorial-collect.
  CollectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-collect-clean-room
      Description: Store the session's files and the builder's plan, commit leftovers, push the work branch from a clean room and collect the agent's summary.
      PackageType: Image
      ImageUri: !Sub
        - ${RepositoryUri}:${OrchestrationImageTag}
        - RepositoryUri: !ImportValue Factorial-OrchestrationRepositoryUri
      ImageConfig:
        Command:
          - collect/index.handler
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 2048
      LoggingConfig:
        LogGroup: !Ref CollectLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref SessionCommandPolicy
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  # Reads back the validated plan files, the one exception to the artefact
  # store being write-only: the builder's copy is in a session treated as
  # hostile, so the stored copy, validated by Collect, is the only one no
  # agent has touched since. Only these two keys are readable.
  PrepareReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-prepare-review-seed
      Description: Set up a fresh reviewer session at the tested commit, from a bundle, with the plan, the summary and the diff.
      PackageType: Image
      ImageUri: !Sub
        - ${RepositoryUri}:${OrchestrationImageTag}
        - RepositoryUri: !ImportValue Factorial-OrchestrationRepositoryUri
      ImageConfig:
        Command:
          - prepare-review/index.handler
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          TRANSFER_BUCKET: !Ref TransferBucket
      LoggingConfig:
        LogGroup: !Ref PrepareReviewLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            - Sid: ReadPlanArtefacts
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.json
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.md
        - !Ref SessionCommandPolicy
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref TransferSeedPolicy
        - !Ref ProgressEventsPolicy

  ContinueBuildFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-continue-build-seed
      Description: Start the next build round in a fresh builder session, from a bundle of the branch, the plan and the previous round's notes.
      PackageType: Image
      ImageUri: !Sub
        - ${RepositoryUri}:${OrchestrationImageTag}
        - RepositoryUri: !ImportValue Factorial-OrchestrationRepositoryUri
      ImageConfig:
        Command:
          - continue-build/index.handler
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          TRANSFER_BUCKET: !Ref TransferBucket
      LoggingConfig:
        LogGroup: !Ref ContinueBuildLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # The read exceptions to the write-only store: the validated plan
            # and the previous round's notes, which Collect stored before the push.
            - Sid: ReadRoundArtefacts
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.json
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.md
                - !Sub ${WorkArtefactsBucket.Arn}/*/build/notes.md
        - !Ref SessionCommandPolicy
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref TransferSeedPolicy
        - !Ref ProgressEventsPolicy

  # Verify (#167), one verifier at a time. PrepareVerify bundles the tested
  # commit for the verifier's task, as PrepareReview does for a session: the
  # orchestration image, the transfer bucket, a read-only token that never
  # reaches the task. It reads no artefact.
  PrepareVerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-prepare-verify
      Description: Bundle the tested commit for one verifier's task, through the transfer bucket.
      PackageType: Image
      ImageUri: !Sub
        - ${RepositoryUri}:${OrchestrationImageTag}
        - RepositoryUri: !ImportValue Factorial-OrchestrationRepositoryUri
      ImageConfig:
        Command:
          - prepare-verify/index.handler
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          TRANSFER_BUCKET: !Ref TransferBucket
      LoggingConfig:
        LogGroup: !Ref PrepareVerifyLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref GitHubAppPolicy
        - !Ref TransferSeedPolicy
        - !Ref ProgressEventsPolicy

  # CollectVerifier judges a verifier from its stopped task, reads the end of
  # the task's log, writes the result and the log, and deletes the bundle the
  # task fetched. It reads no artefact and has no GitHub access.
  CollectVerifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-collect-verifier
      Description: Judge one verifier's result, stopping the turn when a required verifier did not pass.
      CodeUri: ../packages/orchestration/dist/collect-verifier/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 120
      Environment:
        Variables:
          TRANSFER_BUCKET: !Ref TransferBucket
          VERIFIER_LOG_GROUP: !Ref VerifierLogGroup
      LoggingConfig:
        LogGroup: !Ref CollectVerifierLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            - Sid: ReadVerifierLogs
              Effect: Allow
              Action: logs:GetLogEvents
              Resource: !Sub ${VerifierLogGroup.Arn}:log-stream:verifier/verifier/*
            - Sid: DeleteVerifierBundles
              Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${TransferBucket.Arn}/*/verify/*/repo.bundle
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  CollectReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-collect-review
      Description: Read and validate the reviewer's review, add findings for sensitive changes, and store it.
      CodeUri: ../packages/orchestration/dist/collect-review/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref CollectReviewLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
        - !Ref SessionCommandPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy

  OpenPullRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-open-pr
      Description: Open the pull request for human approval and emit the turn's outcome.
      CodeUri: ../packages/orchestration/dist/open-pr/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref OpenPullRequestLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # The pull request on its thread, so later turns on it find the branch.
            - Sid: Threads
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ThreadsTable.Arn
            # The full plan, for the pull request's step list: the state carries only a shortened copy.
            - Sid: ReadPlanArtefacts
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.json
        - !Ref GitHubAppPolicy
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy
        - !Ref OutcomeEventsPolicy

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-report
      Description: End a turn that opens no pull request, and emit its outcome.
      CodeUri: ../packages/orchestration/dist/report/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref ReportLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # A proposal's plan (#169): plan.json's steps and plan.md go into its report.json for the reporter to post, and plan.json's hash binds the approval.
            - Sid: ReadProposedPlan
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.json
                - !Sub ${WorkArtefactsBucket.Arn}/*/plan/plan.md
        - !Ref WorkArtefactsWritePolicy
        - !Ref ProgressEventsPolicy
        - !Ref OutcomeEventsPolicy

  # The GitHub reporter (#165): one reporter per source type, each selected
  # by rules on `source.type`. Reached by ReportGitHubOutcomeRule (the turn's
  # outcome) and ReportGitHubProgressRule (the started notice), it reads the
  # attempt's report.json and nothing else of the artefact store, records
  # each delivery on the ledger row and speaks through the App token (issues
  # and pull requests: write, one repository). It puts no event.
  ReportGitHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-report-github
      Description: Tell requesters on GitHub that their work started, and how it ended.
      CodeUri: ../packages/orchestration/dist/report-github/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref ReportGitHubLogGroup
      Policies:
        - Statement:
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt WorkItemsTable.Arn
            # What delivery needs: the one key every terminal state writes.
            - Sid: ReadReports
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${WorkArtefactsBucket.Arn}/*/report.json
        - !Ref GitHubAppPolicy
        # Where a failed invocation's event goes (ReportGitHubFunctionInvokeConfig).
        - Statement:
            - Sid: FailedDeliveries
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt ReportGitHubFailedQueue.Arn

  # What became of a pull request Factorial opened (#204): reached by
  # PullRequestClosedRule, it sets `outcome` on the pull request's thread,
  # then announces it as a progress event for the item that opened the pull
  # request, built from that item's ledger row (its source and repository
  # only). No GitHub access, no artefacts.
  ThreadOutcomeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-thread-outcome
      Description: Record whether a Factorial pull request was merged or closed on its thread.
      CodeUri: ../packages/orchestration/dist/thread-outcome/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ThreadOutcomeLogGroup
      Policies:
        - Statement:
            - Sid: ThreadIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${ThreadsTable.Arn}/index/pullRequestKey-index
            - Sid: ThreadOutcome
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ThreadsTable.Arn
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt WorkItemsTable.Arn
            # Where a failed invocation's event goes (ThreadOutcomeFunctionInvokeConfig).
            - Sid: FailedOutcomes
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt ThreadOutcomeFailedQueue.Arn
        - !Ref ProgressEventsPolicy

  # The thread reconciler (#237): reached hourly by ThreadReconcileSchedule,
  # it reads the pull request of every thread that records one and no
  # outcome, with a read-only token (pull requests: read, one repository),
  # and records a close GitHub never sent through the thread outcome's own
  # path, only where the thread still holds no outcome. Each one is counted
  # in Factorial/MissedPullRequestCloses. No artefacts, no GitHub writes.
  ThreadReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-thread-reconcile
      Description: Record pull request closes GitHub never sent, and count them.
      CodeUri: ../packages/orchestration/dist/thread-reconcile/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref ThreadReconcileLogGroup
      Policies:
        - Statement:
            - Sid: ThreadsAwaitingOutcome
              Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt ThreadsTable.Arn
            - Sid: ThreadIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${ThreadsTable.Arn}/index/pullRequestKey-index
            - Sid: ThreadOutcome
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ThreadsTable.Arn
            - Sid: Ledger
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt WorkItemsTable.Arn
            - Sid: MissedCloses
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: Factorial
        - !Ref GitHubAppPolicy
        - !Ref ProgressEventsPolicy

  # Work-item progress on the live feed (#194): reached by LiveExecutionRule
  # (the state machine's execution status changes, on the default bus) and
  # LiveProgressRule (WorkItemProgress events), it publishes each to the
  # work-item channels. It holds the publish policy and nothing else: no
  # ledger, no artefacts, no GitHub.
  LiveForwardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: factorial-live-forward
      Description: Publish work-item progress to the live feed.
      CodeUri: ../packages/orchestration/dist/live-forward/
      Runtime: nodejs24.x
      Handler: index.handler
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref LiveForwardLogGroup
      Environment:
        Variables:
          LIVE_HTTP_DOMAIN: !GetAtt LiveApi.Dns.Http
      Policies:
        - !Ref LivePublishPolicy

  # Covers the reviewer's session as well as the builder's.
  # The description still names only the builder: changing a managed policy's
  # description replaces it, and the replacement collides with the fixed name.
  SessionCommandPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-session-command
      # Out of date (it covers every role's session now) but kept: IAM cannot
      # change a policy's description in place, so editing it replaces the
      # policy, and the fixed name makes the replacement fail (#130's deploy).
      Description: Run deterministic commands in the builder harness session.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Each role's Runtime: commands only, since the invoker runs the
          # agent, and stopping the session once Collect or CollectReview has
          # finished with it.
          - Effect: Allow
            Action:
              - bedrock-agentcore:InvokeAgentRuntimeCommand
              - bedrock-agentcore:StopRuntimeSession
            Resource:
              - !ImportValue Factorial-BuilderRuntimeArn
              - !Sub
                - ${RuntimeArn}/runtime-endpoint/*
                - RuntimeArn: !ImportValue Factorial-BuilderRuntimeArn
              - !ImportValue Factorial-ReviewerRuntimeArn
              - !Sub
                - ${RuntimeArn}/runtime-endpoint/*
                - RuntimeArn: !ImportValue Factorial-ReviewerRuntimeArn

  # Only orchestrator functions, outside the agent sandbox, may read the App
  # key and mint tokens.
  GitHubAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-github-app
      Description: Read the GitHub App identifiers and private key to mint installation tokens.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/factorial/github/*
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:factorial/github/app-private-key-*

  # ---------------------------------------------------------------------------
  # The state machine. Deterministic; the agent runs inside the Build state.
  # ---------------------------------------------------------------------------
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/factorial-work
      RetentionInDays: !Ref LogRetentionDays

  OrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-orchestrator
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-orchestrator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeSteps
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Ref IntakeFunction.Alias
                  - !Ref PrepareFunction.Alias
                  - !Ref CollectFunction.Alias
                  - !Ref ContinueBuildFunction.Alias
                  - !Ref PrepareVerifyFunction.Alias
                  - !Ref CollectVerifierFunction.Alias
                  - !Ref PrepareReviewFunction.Alias
                  - !Ref CollectReviewFunction.Alias
                  - !Ref OpenPullRequestFunction.Alias
                  - !Ref ReportFunction.Alias
              - Sid: RunInvoker
                Effect: Allow
                Action: ecs:RunTask
                Resource:
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/factorial-invoker:*
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/factorial-verifier:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt BuildCluster.Arn
              - Sid: TrackInvoker
                Effect: Allow
                Action:
                  - ecs:StopTask
                  - ecs:DescribeTasks
                Resource: '*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt BuildCluster.Arn
              - Sid: PassInvokerRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt InvokerExecutionRole.Arn
                  - !GetAtt InvokerTaskRole.Arn
                  - !GetAtt VerifierExecutionRole.Arn
                  - !ImportValue Factorial-VerifierTaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ManagedRuleForSyncTasks
                Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule
              - Sid: ExecutionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
      Tags:
        - Key: Project
          Value: Factorial

  WorkStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: factorial-work
      StateMachineType: STANDARD
      RoleArn: !GetAtt OrchestratorRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionSubstitutions:
        FactorialVersion: !Ref FactorialVersion
        BuildTimeoutSeconds: !Ref BuildTimeoutSeconds
        MaxBuildRounds: !FindInMap [Builder, MaxRounds, Value]
        ReviewTimeoutSeconds: !Ref ReviewTimeoutSeconds
        IntakeFunctionAlias: !Ref IntakeFunction.Alias
        PrepareFunctionAlias: !Ref PrepareFunction.Alias
        CollectFunctionAlias: !Ref CollectFunction.Alias
        ContinueBuildFunctionAlias: !Ref ContinueBuildFunction.Alias
        PrepareVerifyFunctionAlias: !Ref PrepareVerifyFunction.Alias
        CollectVerifierFunctionAlias: !Ref CollectVerifierFunction.Alias
        PrepareReviewFunctionAlias: !Ref PrepareReviewFunction.Alias
        CollectReviewFunctionAlias: !Ref CollectReviewFunction.Alias
        OpenPullRequestFunctionAlias: !Ref OpenPullRequestFunction.Alias
        ReportFunctionAlias: !Ref ReportFunction.Alias
        ClusterArn: !GetAtt BuildCluster.Arn
        TaskDefinitionArn: !Ref InvokerTaskDefinition
        BuilderRuntimeArn: !ImportValue Factorial-BuilderRuntimeArn
        ReviewerRuntimeArn: !ImportValue Factorial-ReviewerRuntimeArn
        VerifierTaskDefinitionArn: !Ref VerifierTaskDefinition
        VerifierSecurityGroup: !Ref VerifierSecurityGroup
        SubnetA: !Ref SubnetA
        SubnetB: !Ref SubnetB
        SecurityGroup: !Ref InvokerSecurityGroup
      DefinitionString: |
        {
          "Comment": "Factorial: intake -> build (planning first) -> verify -> review -> PR. Deterministic; Intake chooses the route from a fixed set, the agents run inside Build and Review, and the target's declared checks run inside Verify.",
          "QueryLanguage": "JSONata",
          "StartAt": "Start",
          "States": {
            "Start": {
              "Type": "Pass",
              "Assign": {
                "workItemInput": "{% $states.input %}",
                "intake": null,
                "ctx": null,
                "collect": null,
                "verify": null,
                "failure": null,
                "plan": null,
                "buildRound": 1,
                "buildSession": null,
                "buildStart": null,
                "reviewPrep": null,
                "reviewError": null,
                "review": null
              },
              "Output": { "workItemId": "{% $states.input.id %}" },
              "Next": "Intake"
            },
            "Intake": {
              "Type": "Task",
              "Comment": "Accept the WorkItem once, resolve its thread and choose its route. A refusal is recorded and ends the turn with an outcome, which the reporter answers when a person asked.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${IntakeFunctionAlias}",
                "Payload": {
                  "workItem": "{% $workItemInput %}",
                  "factorialVersion": "${FactorialVersion}",
                  "executionArn": "{% $states.context.Execution.Id %}",
                  "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" }
                }
              },
              "Assign": { "intake": "{% $states.result.Payload %}" },
              "Output": {
                "workItemId": "{% $workItemInput.id %}",
                "attempt": "{% $states.result.Payload.attempt %}",
                "route": "{% $states.result.Payload.route %}",
                "threadKey": "{% $exists($states.result.Payload.threadKey) ? $states.result.Payload.threadKey : null %}"
              },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["DuplicateWorkItem"], "Output": { "workItemId": "{% $workItemInput.id %}", "error": "{% $states.errorOutput %}" }, "Next": "Duplicate" },
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $workItemInput.id %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Route"
            },
            "Route": {
              "Type": "Choice",
              "Comment": "The route Intake chose, from the enum in contracts/intake/v1. change and propose both start at Prepare (propose seeds the route for the host, and Collect ends it); refuse runs nothing further.",
              "Choices": [ { "Condition": "{% $intake.route = 'change' or $intake.route = 'propose' %}", "Next": "Prepare" } ],
              "Default": "NotAdmitted"
            },
            "Prepare": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${PrepareFunctionAlias}",
                "Payload": {
                  "workItem": "{% $workItemInput %}",
                  "factorialVersion": "${FactorialVersion}",
                  "intake": "{% $intake %}",
                  "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" }
                }
              },
              "Assign": { "ctx": "{% $states.result.Payload %}", "buildSession": "{% $states.result.Payload.sessionId %}" },
              "Output": {
                "workItemId": "{% $states.result.Payload.workItem.id %}",
                "attempt": "{% $states.result.Payload.attempt %}",
                "branch": "{% $states.result.Payload.branch %}"
              },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $workItemInput.id %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Build"
            },
            "Duplicate": { "Type": "Succeed", "Comment": "This WorkItem was already accepted; nothing to do." },
            "NotAdmitted": { "Type": "Succeed", "Comment": "Intake refused the item: its pull request is not Factorial's or no longer on its branch, another turn holds the thread, or failed checks reached their limit. Intake recorded why and emitted the outcome; the reporter answers on the pull request when a person asked." },
            "Build": {
              "Type": "Task",
              "Resource": "arn:aws:states:::ecs:runTask.sync",
              "Arguments": {
                "Cluster": "${ClusterArn}",
                "TaskDefinition": "${TaskDefinitionArn}",
                "LaunchType": "FARGATE",
                "PropagateTags": "TASK_DEFINITION",
                "NetworkConfiguration": {
                  "AwsvpcConfiguration": {
                    "Subnets": ["${SubnetA}", "${SubnetB}"],
                    "SecurityGroups": ["${SecurityGroup}"],
                    "AssignPublicIp": "ENABLED"
                  }
                },
                "Overrides": {
                  "ContainerOverrides": [
                    {
                      "Name": "invoker",
                      "Environment": [
                        { "Name": "ROLE", "Value": "builder" },
                        { "Name": "STAGE", "Value": "{% $states.context.State.Name %}" },
                        { "Name": "RUNTIME_ARN", "Value": "${BuilderRuntimeArn}" },
                        { "Name": "RUNTIME_QUALIFIER", "Value": "live" },
                        { "Name": "BUILD_ROUND", "Value": "{% $string($buildRound) %}" },
                        { "Name": "WORK_ITEM_ID", "Value": "{% $ctx.workItem.id %}" },
                        { "Name": "SESSION_ID", "Value": "{% $buildSession %}" },
                        { "Name": "BRANCH", "Value": "{% $ctx.branch %}" },
                        { "Name": "BASE_BRANCH", "Value": "{% $ctx.baseBranch %}" },
                        { "Name": "BASE_COMMIT", "Value": "{% $ctx.baseCommit %}" }
                      ]
                    }
                  ]
                }
              },
              "TimeoutSeconds": ${BuildTimeoutSeconds},
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "taskArn": "{% $states.result.TaskArn %}" },
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "SaveWork" }
              ],
              "Next": "Collect"
            },
            "SaveWork": {
              "Type": "Task",
              "Comment": "The build stopped. Push whatever the agent committed, and anything it left uncommitted, so the work is not lost. If the builder merely ran out of steps or time, the build continues in a fresh session; otherwise the failure is reported, with no tests and no pull request.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": { "FunctionName": "${CollectFunctionAlias}", "Payload": "{% $merge([$ctx, { 'salvage': true, 'builderSessionId': $buildSession, 'roundStart': $buildStart, 'failure': $failure, 'progress': { 'stage': $states.context.State.Name, 'round': $buildRound } }]) %}" },
              "Assign": { "collect": "{% $states.result.Payload %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "collect": "{% $states.result.Payload %}" },
              "Catch": [
                { "ErrorEquals": ["WorkflowChangeRefused"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportWorkflowChangeRefused" },
                { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "BuildIncomplete"
            },
            "BuildIncomplete": {
              "Type": "Choice",
              "Comment": "A builder that stopped at its own limit gets another session, up to MaxBuildRounds; any other failure, or the last round, is reported.",
              "Choices": [ { "Condition": "{% $collect.incomplete = true and $buildRound < ${MaxBuildRounds} %}", "Next": "ContinueBuild" } ],
              "Default": "ReportFailure"
            },
            "ContinueBuild": {
              "Type": "Task",
              "Comment": "Seed a fresh builder session from the branch with the plan and the previous round's notes, then run the builder again.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ContinueBuildFunctionAlias}",
                "Payload": { "ctx": "{% $ctx %}", "round": "{% $buildRound + 1 %}", "collect": "{% $collect %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Assign": {
                "buildSession": "{% $states.result.Payload.sessionId %}",
                "buildRound": "{% $states.result.Payload.round %}",
                "buildStart": "{% $states.result.Payload.roundStart %}",
                "failure": null,
                "collect": null
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "buildRound": "{% $states.result.Payload.round %}", "buildSession": "{% $states.result.Payload.sessionId %}" },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Build"
            },
            "Collect": {
              "Type": "Task",
              "Comment": "Read and validate the builder's plan, then push its work. A build that ends without a valid plan pushes nothing and is reported as invalid-plan; a change under .github/workflows/ or .github/actions/ that the base branch has not opted in to pushes nothing and is reported as workflow-change-refused.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": { "FunctionName": "${CollectFunctionAlias}", "Payload": "{% $merge([$ctx, { 'builderSessionId': $buildSession, 'roundStart': $buildStart, 'progress': { 'stage': $states.context.State.Name, 'round': $buildRound } }]) %}" },
              "Assign": { "collect": "{% $states.result.Payload %}", "plan": "{% $exists($states.result.Payload.plan) ? $states.result.Payload.plan : null %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "collect": "{% $states.result.Payload %}" },
              "Catch": [
                { "ErrorEquals": ["InvalidPlan"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportInvalidPlan" },
                { "ErrorEquals": ["WorkflowChangeRefused"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportWorkflowChangeRefused" },
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "HasChanges"
            },
            "HasChanges": {
              "Type": "Choice",
              "Comment": "A proposal (the propose route, a valid plan and nothing changed) is reported with its plan. A pushed change is verified by the checks its target's base branch declares in .factorial/verifiers.json (Collect's verify). No file: it goes to review unverified, and its pull request says so. An invalid file ends the turn, so a typo cannot remove the gate.",
              "Choices": [
                { "Condition": "{% $collect.proposed = true %}", "Next": "ReportProposed" },
                { "Condition": "{% $collect.pushed = true and $exists($collect.verify.invalid) %}", "Next": "VerifyUnconfigured" },
                { "Condition": "{% $collect.pushed = true and $exists($collect.verify.skipped) %}", "Next": "SkipVerify" },
                { "Condition": "{% $collect.pushed = true %}", "Next": "Verify" }
              ],
              "Default": "ReportNoChanges"
            },
            "VerifyUnconfigured": {
              "Type": "Pass",
              "Comment": "The base branch's .factorial/verifiers.json is not valid: the pushed work is saved on the branch and the turn ends with the file's problems.",
              "Assign": { "failure": "{% { 'Error': 'VerifyUnconfigured', 'Cause': $string({ 'problems': $collect.verify.invalid }) } %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "problems": "{% $collect.verify.invalid %}" },
              "Next": "ReportFailure"
            },
            "SkipVerify": {
              "Type": "Pass",
              "Comment": "The target declares no verifiers: nothing runs, and the result records why, for the pull request and the reply.",
              "Assign": { "verify": "{% { 'skipped': $collect.verify.skipped } %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "verify": "{% { 'skipped': $collect.verify.skipped } %}" },
              "Next": "PrepareReview"
            },
            "Verify": {
              "Type": "Map",
              "Comment": "Each declared verifier in order, on the pushed head, each in a fresh Fargate task from the agent image, which can call no model and reach none of Factorial's data. A required verifier that does not pass fails its iteration, which stops the rest and ends the turn as tests-failed.",
              "Items": "{% $collect.verify.verifiers %}",
              "ItemSelector": { "verifier": "{% $states.context.Map.Item.Value %}", "index": "{% $states.context.Map.Item.Index %}" },
              "MaxConcurrency": 1,
              "ItemProcessor": {
                "ProcessorConfig": { "Mode": "INLINE" },
                "StartAt": "Verifier",
                "States": {
                  "Verifier": {
                    "Type": "Pass",
                    "Assign": { "verifier": "{% $states.input.verifier %}", "verifierIndex": "{% $states.input.index %}", "verifierStart": "{% $states.context.State.EnteredTime %}", "verifierError": null, "verifierTask": null },
                    "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "verifier": "{% $states.input.verifier.name %}" },
                    "Next": "PrepareVerify"
                  },
                  "PrepareVerify": {
                    "Type": "Task",
                    "Comment": "Bundle the tested commit for the verifier's task, through the transfer bucket. A failure is the verifier's error, judged by CollectVerifier.",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Arguments": {
                      "FunctionName": "${PrepareVerifyFunctionAlias}",
                      "Payload": { "ctx": "{% $ctx %}", "collect": "{% $collect %}", "verifier": "{% $verifier %}", "index": "{% $verifierIndex %}", "progress": { "stage": "Verify", "round": "{% $buildRound %}" } }
                    },
                    "Assign": { "verifierSeed": "{% $states.result.Payload %}" },
                    "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "verifier": "{% $verifier.name %}" },
                    "Retry": [
                      {
                        "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 3,
                        "BackoffRate": 2
                      }
                    ],
                    "Catch": [
                      { "ErrorEquals": ["States.ALL"], "Assign": { "verifierError": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "CollectVerifier" }
                    ],
                    "Next": "RunVerifier"
                  },
                  "RunVerifier": {
                    "Type": "Task",
                    "Comment": "A fresh Fargate task from the agent image fetches the bundle, checks out the tested commit and runs the declared command as the unprivileged user; it exits with the command's status. Bounded by the verifier's own timeout and a margin for the task to start and fetch.",
                    "Resource": "arn:aws:states:::ecs:runTask.sync",
                    "Arguments": {
                      "Cluster": "${ClusterArn}",
                      "TaskDefinition": "${VerifierTaskDefinitionArn}",
                      "LaunchType": "FARGATE",
                      "PropagateTags": "TASK_DEFINITION",
                      "NetworkConfiguration": {
                        "AwsvpcConfiguration": {
                          "Subnets": ["${SubnetA}", "${SubnetB}"],
                          "SecurityGroups": ["${VerifierSecurityGroup}"],
                          "AssignPublicIp": "ENABLED"
                        }
                      },
                      "Overrides": {
                        "ContainerOverrides": [
                          {
                            "Name": "verifier",
                            "Environment": [
                              { "Name": "WORK_ITEM_ID", "Value": "{% $ctx.workItem.id %}" },
                              { "Name": "VERIFIER", "Value": "{% $string($verifier) %}" },
                              { "Name": "VERIFY_SHA", "Value": "{% $collect.headSha %}" },
                              { "Name": "VERIFY_BRANCH", "Value": "{% $ctx.branch %}" },
                              { "Name": "DEFAULT_BRANCH", "Value": "{% $verifierSeed.defaultBranch %}" },
                              { "Name": "REPOSITORY", "Value": "{% $verifierSeed.repository %}" },
                              { "Name": "BUNDLE_URL", "Value": "{% $verifierSeed.bundleUrl %}" }
                            ]
                          }
                        ]
                      }
                    },
                    "TimeoutSeconds": "{% $verifier.timeoutSeconds + 600 %}",
                    "Assign": { "verifierTask": "{% $states.result %}" },
                    "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "taskArn": "{% $states.result.TaskArn %}" },
                    "Catch": [
                      { "ErrorEquals": ["States.ALL"], "Assign": { "verifierError": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "CollectVerifier" }
                    ],
                    "Next": "CollectVerifier"
                  },
                  "CollectVerifier": {
                    "Type": "Task",
                    "Comment": "Judge the verifier from its task's exit status (the result, or the cause of a TaskFailed error) and store the end of its log. No exit status is timed-out or error, never a pass. A required verifier that did not pass throws VerifierFailed, which ends the Map.",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Arguments": {
                      "FunctionName": "${CollectVerifierFunctionAlias}",
                      "Payload": { "ctx": "{% $ctx %}", "collect": "{% $collect %}", "verifier": "{% $verifier %}", "index": "{% $verifierIndex %}", "task": "{% $verifierTask %}", "error": "{% $verifierError %}", "startedAt": "{% $verifierStart %}", "progress": { "stage": "Verify", "round": "{% $buildRound %}" } }
                    },
                    "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "verifier": "{% $states.result.Payload %}" },
                    "Retry": [
                      {
                        "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 3,
                        "BackoffRate": 2
                      }
                    ],
                    "End": true
                  }
                }
              },
              "Assign": { "verify": "{% { 'verifiers': $states.result.verifier[] } %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "verify": "{% { 'verifiers': $states.result.verifier[] } %}" },
              "Catch": [
                { "ErrorEquals": ["VerifierFailed"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportTestsFailed" },
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "PrepareReview"
            },
            "PrepareReview": {
              "Type": "Task",
              "Comment": "Set up a fresh reviewer session at the verified commit. The review is advisory: if any review step fails, the pull request still opens, saying the review did not complete.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${PrepareReviewFunctionAlias}",
                "Payload": { "ctx": "{% $ctx %}", "collect": "{% $collect %}", "verify": "{% $verify %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Assign": { "reviewPrep": "{% $states.result.Payload %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "sensitive": "{% $states.result.Payload.sensitivePathsJson %}" },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "OpenPullRequest" }
              ],
              "Next": "Review"
            },
            "Review": {
              "Type": "Task",
              "Comment": "The reviewer judges the change in its own session and writes review.json. Nothing from its session is pushed. A failed run still goes to CollectReview, which may find a review.",
              "Resource": "arn:aws:states:::ecs:runTask.sync",
              "Arguments": {
                "Cluster": "${ClusterArn}",
                "TaskDefinition": "${TaskDefinitionArn}",
                "LaunchType": "FARGATE",
                "PropagateTags": "TASK_DEFINITION",
                "NetworkConfiguration": {
                  "AwsvpcConfiguration": {
                    "Subnets": ["${SubnetA}", "${SubnetB}"],
                    "SecurityGroups": ["${SecurityGroup}"],
                    "AssignPublicIp": "ENABLED"
                  }
                },
                "Overrides": {
                  "ContainerOverrides": [
                    {
                      "Name": "invoker",
                      "Environment": [
                        { "Name": "ROLE", "Value": "reviewer" },
                        { "Name": "STAGE", "Value": "{% $states.context.State.Name %}" },
                        { "Name": "RUNTIME_ARN", "Value": "${ReviewerRuntimeArn}" },
                        { "Name": "RUNTIME_QUALIFIER", "Value": "live" },
                        { "Name": "SENSITIVE_PATHS", "Value": "{% $reviewPrep.sensitivePathsJson %}" },
                        { "Name": "WORK_ITEM_ID", "Value": "{% $ctx.workItem.id %}" },
                        { "Name": "SESSION_ID", "Value": "{% $ctx.sessionId %}" },
                        { "Name": "BRANCH", "Value": "{% $ctx.branch %}" },
                        { "Name": "BASE_BRANCH", "Value": "{% $ctx.baseBranch %}" },
                        { "Name": "BASE_COMMIT", "Value": "{% $ctx.baseCommit %}" }
                      ]
                    }
                  ]
                }
              },
              "TimeoutSeconds": ${ReviewTimeoutSeconds},
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "taskArn": "{% $states.result.TaskArn %}" },
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "reviewError": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "CollectReview" }
              ],
              "Next": "CollectReview"
            },
            "CollectReview": {
              "Type": "Task",
              "Comment": "Validate the review, add findings for sensitive changes and store it. A missing or invalid review is stored as review/error.json and the run continues.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${CollectReviewFunctionAlias}",
                "Payload": { "ctx": "{% $ctx %}", "sensitive": "{% $reviewPrep.sensitive %}", "reviewError": "{% $reviewError %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Assign": { "review": "{% $states.result.Payload %}" },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "reviewed": "{% $states.result.Payload.ok %}" },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "OpenPullRequest" }
              ],
              "Next": "OpenPullRequest"
            },
            "OpenPullRequest": {
              "Type": "Task",
              "Comment": "Opens the pull request, or for a rework item records its existing pull request as updated, and emits the outcome the reporter delivers.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${OpenPullRequestFunctionAlias}",
                "Payload": { "ctx": "{% $ctx %}", "collect": "{% $collect %}", "verify": "{% $verify %}", "plan": "{% $plan %}", "review": "{% $review %}", "prFacts": "{% $exists($reviewPrep.prFacts) ? $reviewPrep.prFacts : null %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "prNumber": "{% $states.result.Payload.prNumber %}", "prUrl": "{% $states.result.Payload.prUrl %}" },
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Done"
            },
            "Done": { "Type": "Succeed" },
            "ReportNoChanges": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "no-changes", "ctx": "{% $ctx %}", "summary": "{% $collect.summary %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "no-changes" },
              "Next": "NoChanges"
            },
            "NoChanges": { "Type": "Succeed", "Comment": "The agent made no changes; the outcome tells the requester." },
            "ReportProposed": {
              "Type": "Task",
              "Comment": "End a propose turn: record it proposed, store its plan in report.json and emit the outcome, which the reporter posts for approval. Nothing was pushed.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "proposed", "ctx": "{% $ctx %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "proposed" },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                { "ErrorEquals": ["States.ALL"], "Assign": { "failure": "{% $states.errorOutput %}" }, "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "error": "{% $states.errorOutput %}" }, "Next": "ReportFailure" }
              ],
              "Next": "Proposed"
            },
            "Proposed": { "Type": "Succeed", "Comment": "A plan was proposed and posted for approval; the trigger label on the issue approves it, as a new turn." },
            "ReportTestsFailed": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "tests-failed", "ctx": "{% $ctx %}", "error": "{% $failure %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "tests-failed" },
              "Next": "TestsFailed"
            },
            "TestsFailed": { "Type": "Fail", "Error": "TestsFailed", "Cause": "A required verifier did not pass on the change." },
            "ReportInvalidPlan": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "invalid-plan", "ctx": "{% $ctx %}", "error": "{% $failure %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "invalid-plan" },
              "Catch": [ { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "invalid-plan", "error": "{% $states.errorOutput %}" }, "Next": "InvalidPlan" } ],
              "Next": "InvalidPlan"
            },
            "InvalidPlan": { "Type": "Fail", "Error": "InvalidPlan", "Cause": "The builder did not produce a valid plan; the outcome tells the requester." },
            "ReportWorkflowChangeRefused": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "workflow-change-refused", "ctx": "{% $ctx %}", "error": "{% $failure %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "workflow-change-refused" },
              "Catch": [ { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $ctx.workItem.id %}", "attempt": "{% $ctx.attempt %}", "status": "workflow-change-refused", "error": "{% $states.errorOutput %}" }, "Next": "WorkflowChangeRefused" } ],
              "Next": "WorkflowChangeRefused"
            },
            "WorkflowChangeRefused": { "Type": "Fail", "Error": "WorkflowChangeRefused", "Cause": "The change edits workflows or actions and the target has not opted in; the outcome tells the requester." },
            "ReportFailure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Arguments": {
                "FunctionName": "${ReportFunctionAlias}",
                "Payload": { "status": "failed", "ctx": "{% $ctx %}", "workItem": "{% $workItemInput %}", "error": "{% $failure %}", "saved": "{% $collect %}", "buildRound": "{% $buildRound %}", "progress": { "stage": "{% $states.context.State.Name %}", "round": "{% $buildRound %}" } }
              },
              "Output": { "workItemId": "{% $workItemInput.id %}", "attempt": "{% $exists($ctx.attempt) ? $ctx.attempt : null %}", "status": "failed" },
              "Catch": [ { "ErrorEquals": ["States.ALL"], "Output": { "workItemId": "{% $workItemInput.id %}", "attempt": "{% $exists($ctx.attempt) ? $ctx.attempt : null %}", "status": "failed", "error": "{% $states.errorOutput %}" }, "Next": "Failed" } ],
              "Next": "Failed"
            },
            "Failed": { "Type": "Fail", "Error": "WorkItemFailed", "Cause": "A step failed; see the execution history and the requester's issue." }
          }
        }
      Tags:
        - Key: Project
          Value: Factorial

  # Each definition change publishes an immutable version; the live alias is
  # moved to it at deploy time. Separate promotion for the state machine comes
  # with the staging canary (see CLAUDE.md, known gaps).
  WorkStateMachineVersion:
    Type: AWS::StepFunctions::StateMachineVersion
    Properties:
      StateMachineArn: !Ref WorkStateMachine
      StateMachineRevisionId: !GetAtt WorkStateMachine.StateMachineRevisionId
      Description: !Sub Factorial ${FactorialVersion}

  WorkStateMachineLiveAlias:
    Type: AWS::StepFunctions::StateMachineAlias
    Properties:
      Name: live
      Description: The state machine version handling new WorkItems.
      RoutingConfiguration:
        - StateMachineVersionArn: !Ref WorkStateMachineVersion
          Weight: 100

  # ---------------------------------------------------------------------------
  # The one rule: every WorkItem on the bus starts an execution on the live
  # alias. In-flight executions finish on the version they started with.
  # ---------------------------------------------------------------------------
  WorkStarterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-work-starter
      PermissionsBoundary: !ImportValue Factorial-PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-work-starter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource:
                  - !Ref WorkStateMachine
                  - !Ref WorkStateMachineLiveAlias
      Tags:
        - Key: Project
          Value: Factorial

  WorkItemRule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-work-item
      Description: Start the Factorial state machine for every WorkItem.
      EventBusName: !ImportValue Factorial-WorkBusName
      State: ENABLED
      EventPattern:
        source:
          - factorial.triggers
        detail-type:
          - WorkItem
      Targets:
        - Id: start-work
          Arn: !Ref WorkStateMachineLiveAlias
          RoleArn: !GetAtt WorkStarterRole.Arn
          InputPath: $.detail

  # Every outcome from a GitHub source goes to the GitHub reporter. A
  # reporter for another source type is its own function and rule.
  ReportGitHubOutcomeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-report-github-outcome
      Description: Route the outcome of each turn from a GitHub source to the GitHub reporter.
      EventBusName: !ImportValue Factorial-WorkBusName
      State: ENABLED
      EventPattern:
        source:
          - factorial.outcome
        detail-type:
          - Outcome
        detail:
          source:
            type:
              - prefix: github-
      Targets:
        - Id: report-github
          Arn: !Ref ReportGitHubFunction.Alias
          DeadLetterConfig:
            Arn: !GetAtt ReportGitHubFailedQueue.Arn

  # Only the progress events the reporter acts on go to it: today a round-1
  # Build start (`round` is recorded from round 2) of an item from a GitHub
  # source, for the started notice. The rule is a filter for cost; the
  # reporter stays the decision and keeps the same checks. A notice on other
  # events widens this pattern in the same change (see reporters/github/).
  ReportGitHubProgressRule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-report-github-progress
      Description: Route the round-1 Build start of each work item from a GitHub source to the GitHub reporter.
      EventBusName: !ImportValue Factorial-WorkBusName
      State: ENABLED
      EventPattern:
        source:
          - factorial.progress
        detail-type:
          - WorkItemProgress
        detail:
          source:
            type:
              - prefix: github-
          stage:
            - Build
          transition:
            - started
          round:
            - exists: false
      Targets:
        - Id: report-github
          Arn: !Ref ReportGitHubFunction.Alias
          DeadLetterConfig:
            Arn: !GetAtt ReportGitHubFailedQueue.Arn

  ReportGitHubOutcomeRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReportGitHubFunction.Alias
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReportGitHubOutcomeRule.Arn

  ReportGitHubProgressRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReportGitHubFunction.Alias
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReportGitHubProgressRule.Arn

  # Deliveries that failed: the function erred after Lambda's retries (GitHub
  # down, a deleted pull request, an unreadable report), or EventBridge could
  # not deliver to it. Each message is the event (metadata only; no content),
  # which can be put on the bus again once the cause is fixed: delivery is
  # idempotent. A failed delivery never changes the turn's status.
  ReportGitHubFailedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: factorial-report-github-failed
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  # Only the two rules may put delivery failures here. The function's role
  # carries its own sqs:SendMessage for the invoke config's OnFailure
  # destination.
  ReportGitHubFailedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ReportGitHubFailedQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RuleDeadLetters
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ReportGitHubFailedQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt ReportGitHubOutcomeRule.Arn
                  - !GetAtt ReportGitHubProgressRule.Arn

  # EventBridge invokes the function asynchronously: after two retries, or an
  # event older than an hour, the event goes to the failed-delivery queue. A
  # delivery that meets another attempt's live claim fails and is retried
  # here; the claim's lease (lib/delivery-ledger.ts) is longer than the
  # function's timeout and shorter than the retries take.
  ReportGitHubFunctionInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: ReportGitHubFunctionAliaslive
    Properties:
      FunctionName: !Ref ReportGitHubFunction
      Qualifier: live
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt ReportGitHubFailedQueue.Arn

  # A delivery that failed for good means a requester was not told. No
  # action yet: the alerts topic comes with #16.
  ReportGitHubFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: factorial-report-github-failed
      AlarmDescription: A GitHub delivery failed after its retries. See the factorial-report-github-failed queue and docs/finding-a-run.md.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ReportGitHubFailedQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # A pull request Factorial opened was closed, merged or not: the trigger
  # adapter's PullRequestClosed event (contracts/pull-request-closed/v1/).
  # Never a WorkItem, so WorkItemRule never matches it.
  PullRequestClosedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-pull-request-closed
      Description: Route each closed Factorial pull request to the thread outcome function.
      EventBusName: !ImportValue Factorial-WorkBusName
      State: ENABLED
      EventPattern:
        source:
          - factorial.triggers
        detail-type:
          - PullRequestClosed
      Targets:
        - Id: thread-outcome
          Arn: !Ref ThreadOutcomeFunction.Alias
          DeadLetterConfig:
            Arn: !GetAtt ThreadOutcomeFailedQueue.Arn

  ThreadOutcomeFunctionRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ThreadOutcomeFunction.Alias
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PullRequestClosedRule.Arn

  # Outcomes that failed to record: the function erred after Lambda's
  # retries, or EventBridge could not deliver to it. Each message is the
  # PullRequestClosed event (metadata only), which can be sent to the bus
  # again once the cause is fixed. Nothing reads the queue yet; alarms are #16.
  ThreadOutcomeFailedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: factorial-thread-outcome-failed
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  # Only the rule may put delivery failures here. The function's role carries
  # its own sqs:SendMessage for the invoke config's OnFailure destination.
  ThreadOutcomeFailedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ThreadOutcomeFailedQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RuleDeadLetters
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ThreadOutcomeFailedQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt PullRequestClosedRule.Arn

  ThreadOutcomeFunctionInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: ThreadOutcomeFunctionAliaslive
    Properties:
      FunctionName: !Ref ThreadOutcomeFunction
      Qualifier: live
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt ThreadOutcomeFailedQueue.Arn

  # The reconciler's schedule, on the default bus like every scheduled rule.
  ThreadReconcileSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-thread-reconcile
      Description: Hourly, record the Factorial pull request closes GitHub never sent.
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Id: thread-reconcile
          Arn: !Ref ThreadReconcileFunction.Alias

  ThreadReconcileSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ThreadReconcileFunction.Alias
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ThreadReconcileSchedule.Arn

  # No retries: the next hour's run is the retry, and a failed run raises
  # ThreadReconcileErrorsAlarm.
  ThreadReconcileFunctionInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: ThreadReconcileFunctionAliaslive
    Properties:
      FunctionName: !Ref ThreadReconcileFunction
      Qualifier: live
      MaximumRetryAttempts: 0

  # A close the reconciler recorded is one the webhook path missed: the App
  # not subscribed to the Pull request event, a failed delivery, or the
  # adapter dropping it (docs/github-app.md). No action yet: the alerts topic
  # comes with #16.
  MissedPullRequestClosesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: factorial-missed-pull-request-closes
      AlarmDescription: >-
        factorial-thread-reconcile recorded a pull request close that GitHub's webhook never delivered.
        In the GitHub App's settings check that Permissions & events > Subscribe to events has Pull request ticked,
        then Advanced > Recent Deliveries for failed pull_request deliveries.
        Its log group names each pull request. See docs/github-app.md.
      Namespace: Factorial
      MetricName: MissedPullRequestCloses
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # A reconciler that fails can miss nothing, so its own failures alarm too.
  ThreadReconcileErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: factorial-thread-reconcile-errors
      AlarmDescription: factorial-thread-reconcile failed, so missed pull request closes are not being recorded. See its log group and docs/github-app.md.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: factorial-thread-reconcile
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # AWS sends Step Functions' execution status changes to the default bus
  # only, so this rule is there, matching only this state machine. Executions
  # start from the live alias; the event names the state machine itself.
  LiveExecutionRule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-live-execution
      Description: Route the work state machine's execution status changes to the live forwarder.
      State: ENABLED
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          stateMachineArn:
            - !Ref WorkStateMachine
      Targets:
        - Id: live-forward
          Arn: !Ref LiveForwardFunction.Alias

  LiveProgressRule:
    Type: AWS::Events::Rule
    Properties:
      Name: factorial-live-progress
      Description: Route every WorkItemProgress event to the live forwarder.
      EventBusName: !ImportValue Factorial-WorkBusName
      State: ENABLED
      EventPattern:
        source:
          - factorial.progress
        detail-type:
          - WorkItemProgress
      Targets:
        - Id: live-forward
          Arn: !Ref LiveForwardFunction.Alias

  LiveForwardExecutionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LiveForwardFunction.Alias
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LiveExecutionRule.Arn

  LiveForwardProgressPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LiveForwardFunction.Alias
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LiveProgressRule.Arn

  # The feed is a view: a notice still failing after two retries, or older
  # than five minutes, is dropped. Nothing queues it.
  LiveForwardInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: LiveForwardFunctionAliaslive
    Properties:
      FunctionName: !Ref LiveForwardFunction
      Qualifier: live
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 300

Outputs:
  WorkStateMachineArn:
    Value: !Ref WorkStateMachine
    Export:
      Name: Factorial-WorkStateMachineArn
  WorkStateMachineLiveAliasArn:
    Value: !Ref WorkStateMachineLiveAlias
    Export:
      Name: Factorial-WorkStateMachineLiveAliasArn
  WorkItemsTableName:
    Value: !Ref WorkItemsTable
    Export:
      Name: Factorial-WorkItemsTableName
  ThreadsTableName:
    Value: !Ref ThreadsTable
  BuildClusterArn:
    Value: !GetAtt BuildCluster.Arn
  WorkArtefactsBucketName:
    Value: !Ref WorkArtefactsBucket
    Export:
      Name: Factorial-WorkArtefactsBucketName
  LiveHttpDomain:
    Description: The live feed's HTTP domain, for publishing and for signing a subscription.
    Value: !GetAtt LiveApi.Dns.Http
  LiveRealtimeDomain:
    Description: The live feed's WebSocket domain, for subscribing.
    Value: !GetAtt LiveApi.Dns.Realtime
  LiveApiArn:
    Description: For a subscriber's appsync:EventConnect.
    Value: !GetAtt LiveApi.ApiArn
  LiveNamespaceArn:
    Description: For a subscriber's appsync:EventSubscribe.
    Value: !GetAtt LiveNamespace.ChannelNamespaceArn
