AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Factorial agents: one block per role (runtime, live endpoint and execution
  role), plus what the roles share (the agent runtime policy and the web
  search gateway). Deployed by GitHub Actions.

Parameters:
  AgentRuntimeImageTag:
    Type: String
    Description: Tag of the agent runtime image in the factorial/agent-runtime repository.
    AllowedPattern: '^[A-Za-z0-9._-]+$'

Resources:
  # ---------------------------------------------------------------------------
  # What every agent role needs to run a runtime, shared so a role's block
  # holds only what names its own. Attached to each execution role; the agent
  # permissions boundary still caps the result. The description still says
  # harness: changing a managed policy's description replaces it, and the
  # replacement collides with the fixed name (#130's deploy).
  # ---------------------------------------------------------------------------
  AgentRuntimePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-agent-runtime
      Description: Shared permissions for running a Factorial harness.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PullAgentImage
            Effect: Allow
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability
            Resource:
              - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/factorial/agent-runtime
          - Sid: RegistryAuth
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr-public:GetAuthorizationToken
              - sts:GetServiceBearerToken
            Resource: '*'
          # AgentCore creates each runtime's log group itself, named
          # after an internal runtime id that CloudFormation cannot read, so
          # the groups are not template resources.
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
          - Sid: LogsAccountLevel
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Sid: Tracing
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: '*'
          - Sid: Metrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: bedrock-agentcore
          # Deliberately absent, for every role:
          # - GitHub credentials. Agents never push or call GitHub; the
          #   orchestrator clones before and pushes after an agent runs with
          #   a short-lived, single-repository token never stored in the
          #   session.
          # - events:PutEvents. The agent's shell shares its role, so any
          #   event the host could emit, a prompt-injected agent could
          #   forge. Completion is observed by the orchestrator instead.

  # ---------------------------------------------------------------------------
  # Web search. AgentCore's managed Web Search connector behind a gateway,
  # called by the builder's host as its in-process web_search tool (signed
  # with the builder's execution role). Queries are served within AWS, so there is no
  # third-party search provider or key. The gateway assumes this role to
  # call the AWS-owned connector; AgentCore is given it, so it is an agent role
  # under the agent boundary, which allows only these two actions beyond
  # running an agent.
  # ---------------------------------------------------------------------------
  WebSearchGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-agent-web-search-gateway
      Description: Service role of the Factorial web search gateway.
      PermissionsBoundary: !ImportValue Factorial-AgentPermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/factorial-web-search-*
      Policies:
        - PolicyName: factorial-agent-web-search-gateway
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Named rather than referenced: the gateway takes this role's
              # ARN, so the role cannot take the gateway's.
              - Sid: InvokeGateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/factorial-web-search-*
              # Checked per request against the service-owned connector ARN.
              - Sid: InvokeWebSearch
                Effect: Allow
                Action: bedrock-agentcore:InvokeWebSearch
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1
      Tags:
        - Key: Project
          Value: Factorial

  WebSearchGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: factorial-web-search
      Description: Web search for Factorial's agents.
      ProtocolType: MCP
      # Callers sign with SigV4; only roles granted InvokeGateway on this
      # gateway (the execution roles whose blocks grant it) can call it.
      AuthorizerType: AWS_IAM
      RoleArn: !GetAtt WebSearchGatewayRole.Arn
      Tags:
        Project: Factorial

  # Exposes one MCP tool, WebSearch: a query of up to 200 characters and up
  # to 25 results of snippets, URLs, titles and dates. CloudFormation cannot
  # pin a connector version (ConnectorSource has only ConnectorId, checked
  # 2026-10-18), so the target uses the connector's current default.
  WebSearchTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt WebSearchGateway.GatewayIdentifier
      Name: web-search
      Description: AgentCore Web Search connector.
      TargetConfiguration:
        Mcp:
          Connector:
            Source:
              ConnectorId: web-search
            Configurations:
              - Name: WebSearch
                ParameterValues: {}
      # Connector targets support only the gateway's own role.
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE

  # ===========================================================================
  # Role blocks. One block per agent role: its execution role, runtime, live
  # endpoint and outputs. Every role is a runtime from the agent-runtime
  # image running Factorial's host around pi, which reads its role from
  # FACTORIAL_ROLE: the builder, which also plans (its plan subagent), and the
  # reviewer. To add a role <role>, add its manifest (packages/roles) and its
  # host part (packages/agent-runtime/src/roles.ts), then copy a block and
  # change:
  # - logical IDs to <Role>RuntimeRole, <Role>Runtime and
  #   <Role>RuntimeLiveEndpoint;
  # - RoleName to factorial-agent-<role>, AgentRuntimeName to
  #   factorial_<role>, and the trust's runtime/factorial_<role>-* source;
  # - the models (in the role's Bedrock statements too) and the limits;
  # - outputs to <Role>RuntimeArn, <Role>RuntimeId and
  #   <Role>RuntimeLiveEndpointArn. The deploy workflow promotes the live
  #   endpoint of every *RuntimeId output, so nothing else changes.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Role: builder. Plans the change with its plan subagent, then makes it.
  # Factorial's host process around pi on AgentCore Runtime
  # (docs/pi-plan.md), on Claude through Bedrock with this role and no model
  # key.
  # Every update creates an immutable runtime version; the live endpoint is
  # moved by the deploy workflow's promotion step, never by this template.
  # ---------------------------------------------------------------------------
  BuilderRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-agent-builder
      Description: Execution role of the Factorial builder runtime.
      PermissionsBoundary: !ImportValue Factorial-AgentPermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/factorial_builder-*
      ManagedPolicyArns:
        - !Ref AgentRuntimePolicy
      Policies:
        - PolicyName: factorial-agent-builder
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The models are pinned here as well as on the runtime version
              # (FACTORIAL_*MODEL below): this role can call only these
              # inference profiles, and the foundation models only through
              # them. Changing a model changes both. Global profiles since
              # 2026-10-28 (#181): requests may be served in any commercial
              # region, accepted for the proof of concept, and their list
              # prices are the ones pi estimates with. The EU
              # profiles stay granted until no session runs on a version that
              # names them; the deploy moves this role before `live`.
              - Sid: InferenceProfiles
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-5-5
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-sonnet-5-5
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-5-5
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-haiku-5-5
              - Sid: FoundationModelsThroughProfiles
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-5-5
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-haiku-5-5
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn:
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-5-5
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-sonnet-5-5
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-5-5
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-haiku-5-5
              # The host's web_search tool signs gateway calls with this role.
              # The agent's shell shares the role, so could call the gateway
              # directly too; that is the same read-only search.
              - Sid: WebSearchGateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !GetAtt WebSearchGateway.GatewayArn
      Tags:
        - Key: Project
          Value: Factorial

  BuilderRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: factorial_builder
      # Runtime V2 restores sessions from a snapshot. Set explicitly; rollback is V1.
      PlatformVersion: V2
      Description: Factorial builder on pi.
      RoleArn: !GetAtt BuilderRuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Join
            - ':'
            - - !ImportValue Factorial-AgentRuntimeRepositoryUri
              - !Ref AgentRuntimeImageTag
      ProtocolConfiguration: HTTP
      NetworkConfiguration:
        NetworkMode: PUBLIC
      LifecycleConfiguration:
        # A fallback only: Collect and CollectReview stop each session as soon as
        # they have finished with it, so an idle session is billed for memory
        # only on paths that do not stop (a failed Collect, a stage that never
        # ran). It must still cover the longest idle gap in a run, from
        # Prepare's last command to the invoker's first call (the Fargate task
        # start, not yet measured), plus the Lambda retries (2 s + 4 s).
        # A session reporting HealthyBusy is not idle. AgentCore's minimum is 60.
        IdleRuntimeSessionTimeout: 300
        MaxLifetime: 14400
      # Part of the immutable runtime version, read by the host at start and
      # never taken from a request (packages/agent-runtime/src/config.ts).
      # Fixed here, not parameters: `cloudformation deploy` keeps a
      # parameter's previous value, so a changed default never reaches an
      # existing stack. AWS_REGION is reserved and set by the service.
      EnvironmentVariables:
        FACTORIAL_ROLE: builder
        # Reasoning effort, high since spike #181. Unset, pi's default is
        # medium.
        FACTORIAL_EFFORT: high
        # The run contract the host speaks (contracts/run/v1/). The invoker
        # reads it from the version serving `live` before it invokes, so a
        # version from either side of a contract change fails before any
        # model call. The host refuses to start unless it matches.
        FACTORIAL_RUN_CONTRACT: '1'
        # Named by purpose: the main loop, the explore subagent and the
        # harness's background calls. Each must be allowed in the role above.
        FACTORIAL_MODEL: global.anthropic.claude-sonnet-5-5
        FACTORIAL_EXPLORE_MODEL: global.anthropic.claude-haiku-5-5
        FACTORIAL_BACKGROUND_MODEL: global.anthropic.claude-haiku-5-5
        # A run that reaches a limit ends incomplete and the next round
        # continues it. Set from the spike (docs/harness-vs-runtime.md,
        # Spike results): the largest run took 42 turns and $1.05.
        FACTORIAL_MAX_TURNS: '150'
        FACTORIAL_MAX_BUDGET_USD: '5'
        # Below the orchestration stack's BuildTimeoutSeconds (7200), so the
        # host ends the run itself and Collect still runs; a Step Functions
        # timeout would stop the invoker task and lose uncollected commits.
        FACTORIAL_MAX_DURATION_SECONDS: '6600'
        FACTORIAL_WEB_SEARCH_GATEWAY_URL: !GetAtt WebSearchGateway.GatewayUrl
      Tags:
        Project: Factorial

  # Created once at whatever version is current. AgentRuntimeVersion is
  # deliberately not set: promotion is the deploy workflow's final step.
  BuilderRuntimeLiveEndpoint:
    Type: AWS::BedrockAgentCore::RuntimeEndpoint
    Properties:
      AgentRuntimeId: !GetAtt BuilderRuntime.AgentRuntimeId
      Name: live
      Description: The builder runtime version handling new WorkItems.
      Tags:
        Project: Factorial

  # ---------------------------------------------------------------------------
  # Role: reviewer. Judges the pushed change against its request and plan, and
  # writes /workspace/review.json (contracts/review). Advisory: the review goes
  # into the artefact store and the pull request body and never blocks the
  # pull request. It makes no changes, and only review.json is read out of its
  # session. No web search: everything it judges is in the session. The
  # Review stage, after Test, runs it.
  # Factorial's host in review mode (FACTORIAL_ROLE: reviewer), on Claude
  # through Bedrock with this role and no model key, as the builder is. The
  # role keeps the logical id it had when it served the reviewer harness: a
  # new logical id with the same RoleName would fail to create.
  # ---------------------------------------------------------------------------
  ReviewerAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-agent-reviewer
      Description: Execution role of the Factorial reviewer.
      PermissionsBoundary: !ImportValue Factorial-AgentPermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/factorial_reviewer-*
      ManagedPolicyArns:
        - !Ref AgentRuntimePolicy
      Policies:
        - PolicyName: factorial-agent-reviewer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The runtime's models, pinned here as well as on the runtime
              # version (FACTORIAL_*MODEL below), as for the builder.
              - Sid: InferenceProfiles
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-5-5
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-sonnet-5-5
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-5-5
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-haiku-5-5
              - Sid: FoundationModelsThroughProfiles
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-5-5
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-haiku-5-5
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn:
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-5-5
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-sonnet-5-5
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-5-5
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-haiku-5-5
      Tags:
        - Key: Project
          Value: Factorial

  ReviewerRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: factorial_reviewer
      # Runtime V2 restores sessions from a snapshot. Set explicitly; rollback is V1.
      PlatformVersion: V2
      Description: Factorial reviewer on pi.
      RoleArn: !GetAtt ReviewerAgentRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Join
            - ':'
            - - !ImportValue Factorial-AgentRuntimeRepositoryUri
              - !Ref AgentRuntimeImageTag
      ProtocolConfiguration: HTTP
      NetworkConfiguration:
        NetworkMode: PUBLIC
      LifecycleConfiguration:
        # As on BuilderRuntime: a fallback behind CollectReview's explicit stop.
        IdleRuntimeSessionTimeout: 300
        MaxLifetime: 3600
      # As for the builder: part of the immutable runtime version, fixed here
      # rather than parameters. No FACTORIAL_EXPLORE_MODEL (no subagents) and
      # no web search gateway.
      EnvironmentVariables:
        FACTORIAL_ROLE: reviewer
        # As the builder's.
        FACTORIAL_EFFORT: high
        # As the builder's (contracts/run/v1/).
        FACTORIAL_RUN_CONTRACT: '1'
        FACTORIAL_MODEL: global.anthropic.claude-sonnet-5-5
        FACTORIAL_BACKGROUND_MODEL: global.anthropic.claude-haiku-5-5
        # A review reads a diff and its surroundings and writes one file; the
        # harness allowed 40 steps. A run that reaches a limit keeps whatever
        # review.json it has written, which CollectReview judges.
        FACTORIAL_MAX_TURNS: '60'
        FACTORIAL_MAX_BUDGET_USD: '2'
        # Below the orchestration stack's ReviewTimeoutSeconds (1200), so the
        # host ends the run itself and CollectReview reads what it left.
        FACTORIAL_MAX_DURATION_SECONDS: '900'
      Tags:
        Project: Factorial

  # Created once at whatever version is current; promoted by the deploy
  # workflow, never by this template.
  ReviewerRuntimeLiveEndpoint:
    Type: AWS::BedrockAgentCore::RuntimeEndpoint
    Properties:
      AgentRuntimeId: !GetAtt ReviewerRuntime.AgentRuntimeId
      Name: live
      Description: The reviewer runtime version handling new WorkItems.
      Tags:
        Project: Factorial

Outputs:
  BuilderRuntimeArn:
    Value: !GetAtt BuilderRuntime.AgentRuntimeArn
    Export:
      Name: Factorial-BuilderRuntimeArn
  BuilderRuntimeId:
    Value: !GetAtt BuilderRuntime.AgentRuntimeId
    Export:
      Name: Factorial-BuilderRuntimeId
  BuilderRuntimeLiveEndpointArn:
    Value: !GetAtt BuilderRuntimeLiveEndpoint.AgentRuntimeEndpointArn
    Export:
      Name: Factorial-BuilderRuntimeLiveEndpointArn
  ReviewerRuntimeArn:
    Value: !GetAtt ReviewerRuntime.AgentRuntimeArn
    Export:
      Name: Factorial-ReviewerRuntimeArn
  ReviewerRuntimeId:
    Value: !GetAtt ReviewerRuntime.AgentRuntimeId
    Export:
      Name: Factorial-ReviewerRuntimeId
  ReviewerRuntimeLiveEndpointArn:
    Value: !GetAtt ReviewerRuntimeLiveEndpoint.AgentRuntimeEndpointArn
    Export:
      Name: Factorial-ReviewerRuntimeLiveEndpointArn
