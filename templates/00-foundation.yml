AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Factorial foundation: GitHub OIDC provider, deployment role, CloudFormation
  execution role, permissions boundary, artefact bucket and container registry.
  Deployed once by a human (see docs/bootstrap.md). This is the one exception to
  deploying through GitHub Actions, because it creates the deployment role itself.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the Factorial repository.
    AllowedPattern: '^[A-Za-z0-9-]+$'
  GitHubRepository:
    Type: String
    Description: Name of the Factorial repository.
    AllowedPattern: '^[A-Za-z0-9._-]+$'
  GitHubOwnerId:
    Type: String
    Description: >-
      Numeric ID of the GitHub owner. GitHub issues OIDC tokens with an
      immutable subject that embeds owner and repository IDs, so trust is bound
      to this exact repository even if it is renamed or recreated.
      Find it with: gh api repos/<owner>/<repo> --jq .owner.id
    AllowedPattern: '^[0-9]+$'
  GitHubRepositoryId:
    Type: String
    Description: 'Numeric ID of the repository. Find it with: gh api repos/<owner>/<repo> --jq .id'
    AllowedPattern: '^[0-9]+$'
  DeployEnvironment:
    Type: String
    Default: production
    Description: >-
      GitHub environment whose jobs may assume the deployment role. The
      environment's deployment branch policy limits it to main, so only a job
      on main that names this environment can deploy, not any workflow that
      happens to run on main.
    AllowedPattern: '^[A-Za-z0-9._-]+$'

Resources:
  # ---------------------------------------------------------------------------
  # Identity for GitHub Actions. No stored AWS keys anywhere.
  # ---------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates GitHub's certificate chain directly; these are kept for
      # completeness and older partitions.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Permissions boundary. Every IAM role Factorial creates for itself (Lambdas,
  # the state machine, the agent harness) must carry this boundary. It is the
  # mechanical enforcement of "agents never deploy or promote Factorial" and of
  # "no privilege escalation": whatever a role's own policy says, it can never
  # exceed what is allowed here.
  #
  # It is an allowlist. Only the services and actions Factorial roles need at
  # runtime are permitted; anything not listed (IAM, CloudFormation changes,
  # Organizations, billing, access points, registry settings, ...) is outside
  # the boundary by construction. The Deny statements at the end are defence
  # in depth for the few allowed services that contain a dangerous subset.
  # ---------------------------------------------------------------------------
  PermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-permissions-boundary
      Description: >-
        Upper bound for every role Factorial creates. Allowlists the services
        Factorial uses at runtime and denies deploying or promoting Factorial.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # --- What a Factorial role may do, at most ---
          - Sid: AgentsAndModels
            Effect: Allow
            Action:
              - bedrock-agentcore:*
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:ApplyGuardrail
            Resource: '*'
          - Sid: Orchestration
            Effect: Allow
            Action:
              - states:*
              - lambda:InvokeFunction
              - lambda:InvokeFunctionUrl
              - lambda:GetFunction
              - lambda:GetAlias
              - events:PutEvents
              # Step Functions creates managed EventBridge rules to track
              # ECS tasks run with the .sync pattern.
              - events:PutRule
              - events:PutTargets
              - events:DescribeRule
              - events:DeleteRule
              - events:RemoveTargets
              - ecs:RunTask
              - ecs:StopTask
              - ecs:DescribeTasks
              - sns:Publish
            Resource: '*'
          - Sid: FactorialQueues
            Effect: Allow
            Action: sqs:*
            Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:factorial-*
          - Sid: Telemetry
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:StartQuery
              - logs:GetQueryResults
              # Vended log delivery (Step Functions execution logging).
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - cloudwatch:PutMetricData
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - xray:*
            Resource: '*'
          - Sid: FactorialData
            Effect: Allow
            Action:
              - dynamodb:*
              - s3:*
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/factorial-*
              - !Sub arn:${AWS::Partition}:s3:::factorial-*
              - !Sub arn:${AWS::Partition}:s3:::factorial-*/*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/factorial/*
          - Sid: Secrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:factorial/*
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/*
          - Sid: ContainerImagesReadOnly
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecr-public:GetAuthorizationToken
              - sts:GetServiceBearerToken
            Resource: '*'
          # Only through another AWS service (Secrets Manager, SSM, S3, ...),
          # never as direct calls against arbitrary keys in the account.
          - Sid: Encryption
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringLike:
                kms:ViaService: !Sub '*.${AWS::Region}.amazonaws.com'
          - Sid: ReadStackState
            Effect: Allow
            Action:
              - cloudformation:Describe*
              - cloudformation:Get*
              - cloudformation:List*
            Resource: '*'
          - Sid: WhoAmI
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: '*'
          # Bounded roles may only hand off to, or step into, other Factorial
          # roles, which carry this boundary themselves. Any account is allowed
          # so that the future sandbox-account roles work.
          - Sid: AssumeOrPassFactorialRolesOnly
            Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::*:role/factorial-*
          # --- Dangerous subsets of the allowed services ---
          - Sid: DenyPromotingOrChangingVersions
            Effect: Deny
            Action:
              - bedrock-agentcore:CreateHarness
              - bedrock-agentcore:UpdateHarness
              - bedrock-agentcore:DeleteHarness
              - bedrock-agentcore:CreateHarnessEndpoint
              - bedrock-agentcore:UpdateHarnessEndpoint
              - bedrock-agentcore:DeleteHarnessEndpoint
              - bedrock-agentcore:CreateAgentRuntime
              - bedrock-agentcore:UpdateAgentRuntime
              - bedrock-agentcore:DeleteAgentRuntime
              - bedrock-agentcore:CreateAgentRuntimeEndpoint
              - bedrock-agentcore:UpdateAgentRuntimeEndpoint
              - bedrock-agentcore:DeleteAgentRuntimeEndpoint
              - states:CreateStateMachine
              - states:UpdateStateMachine
              - states:DeleteStateMachine
              - states:PublishStateMachineVersion
              - states:DeleteStateMachineVersion
              - states:CreateStateMachineAlias
              - states:UpdateStateMachineAlias
              - states:DeleteStateMachineAlias
            Resource: '*'
          # Model keys and OAuth tokens are resolved only by agent execution
          # roles, which carry the agent boundary below. No other runtime role
          # may read or change a credential.
          - Sid: DenyCredentials
            Effect: Deny
            Action:
              - bedrock-agentcore:GetResource*
              - bedrock-agentcore:GetWorkloadAccessToken*
              - bedrock-agentcore:Create*CredentialProvider
              - bedrock-agentcore:Update*CredentialProvider
              - bedrock-agentcore:Delete*CredentialProvider
              - bedrock-agentcore:*WorkloadIdentity
              - bedrock-agentcore:SetTokenVaultCMK
            Resource: '*'
          # Deployment artefacts are written only by the deploy role. A bounded
          # role must never be able to substitute them.
          - Sid: DenyWritingDeploymentArtefacts
            Effect: Deny
            NotAction:
              - s3:Get*
              - s3:List*
            Resource:
              - !GetAtt ArtefactBucket.Arn
              - !Sub ${ArtefactBucket.Arn}/*
          # factorial-deploy and factorial-cloudformation match the factorial-*
          # prefix above, so they must be excluded explicitly.
          - Sid: DenyTouchingTheFoundation
            Effect: Deny
            Action: '*'
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-deploy
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-cloudformation
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/factorial-permissions-boundary
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/factorial-agent-permissions-boundary
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com

  # ---------------------------------------------------------------------------
  # Agent permissions boundary. Agent execution roles are shared with the
  # agent's own shell, so once an agent has run its session is treated as
  # hostile. Their ceiling is therefore only what a harness needs to run:
  # pull its image, resolve its model key through the service, search the web
  # through a Factorial gateway, and emit telemetry. No data, orchestration,
  # Factorial roles or other services.
  #
  # The execution role enforces which boundary a role gets: roles named
  # factorial-agent or factorial-agent-* must carry this one, and only those
  # roles may be passed to AgentCore. A new agent therefore gets this ceiling
  # just by following the naming convention.
  # ---------------------------------------------------------------------------
  AgentPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: factorial-agent-permissions-boundary
      Description: >-
        Upper bound for every agent execution role. Allows running a harness
        and nothing else.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Models
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:ApplyGuardrail
            Resource: '*'
          - Sid: ModelCredentials
            Effect: Allow
            Action:
              - bedrock-agentcore:GetWorkloadAccessToken
              - bedrock-agentcore:GetWorkloadAccessTokenForJWT
              - bedrock-agentcore:GetResourceApiKey
              - bedrock-agentcore:GetResourceOauth2Token
            Resource:
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/*credentialprovider/factorial-*
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/harness_factorial_*
          # Only the service-mediated read the harness makes to resolve a
          # credential provider; never a direct read from the agent's shell.
          - Sid: SecretsViaServiceOnly
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:factorial/*
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/*
            Condition:
              Bool:
                aws:ViaAWSService: 'true'
          # Web search through Factorial's own gateways. InvokeGateway is the
          # harness calling the gateway; InvokeWebSearch is the gateway's
          # service role calling the AWS-owned connector. The gateway role is
          # passed to AgentCore, so it is an agent role under this boundary.
          - Sid: WebSearch
            Effect: Allow
            Action:
              - bedrock-agentcore:InvokeGateway
              - bedrock-agentcore:InvokeWebSearch
            Resource:
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/factorial-*
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1
          - Sid: AgentImages
            Effect: Allow
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/factorial/*
          - Sid: RegistryAuth
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr-public:GetAuthorizationToken
              - sts:GetServiceBearerToken
            Resource: '*'
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*
          - Sid: Telemetry
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - cloudwatch:PutMetricData
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: '*'

  # ---------------------------------------------------------------------------
  # CloudFormation execution role. CloudFormation assumes this to create the
  # resources in Factorial's stacks, so the deploy role itself never needs
  # permissions on individual services. Scoped to factorial-* resource names.
  # ---------------------------------------------------------------------------
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-cloudformation
      Description: Assumed by CloudFormation to deploy Factorial's own stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-cloudformation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # --- IAM: Factorial roles must carry a permissions boundary ---
              - Sid: CreateFactorialRolesOnlyWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary:
                      - !Ref PermissionsBoundary
                      - !Ref AgentPermissionsBoundary
              # Agent roles take the agent boundary, whatever a template asks.
              - Sid: AgentRolesOnlyWithAgentBoundary
                Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-agent
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-agent-*
                Condition:
                  StringNotEquals:
                    iam:PermissionsBoundary: !Ref AgentPermissionsBoundary
              # And only agent roles may run inside AgentCore, so no harness or
              # runtime can execute with the wider runtime boundary.
              - Sid: OnlyAgentRolesForAgentCore
                Effect: Deny
                Action: iam:PassRole
                NotResource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-agent
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-agent-*
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock-agentcore.amazonaws.com
              - Sid: ManageFactorialRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                  - iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-*
              - Sid: ManageFactorialPolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/factorial-*
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*
              # Templates with Lambda functions use the Serverless transform,
              # which CloudFormation expands under this role.
              - Sid: ExpandServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: NeverRemoveABoundary
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'
              - Sid: NeverTouchTheFoundation
                Effect: Deny
                Action: '*'
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-deploy
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/factorial-cloudformation
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/factorial-permissions-boundary
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/factorial-agent-permissions-boundary
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
              # Deployments create credential providers but never read what
              # they hold.
              - Sid: NeverReadCredentials
                Effect: Deny
                Action:
                  - bedrock-agentcore:GetResource*
                  - bedrock-agentcore:GetWorkloadAccessToken*
                Resource: '*'
              # --- Services Factorial is built from, scoped by name ---
              - Sid: EventBridge
                Effect: Allow
                Action: events:*
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/factorial-*
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/factorial-*
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/factorial-*/*
              - Sid: StepFunctions
                Effect: Allow
                Action: states:*
                Resource:
                  - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:factorial-*
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:factorial-*
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/factorial/*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/factorial-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/factorial-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/events/factorial-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*
              - Sid: LogDeliveryForVendedLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                  - logs:PutResourcePolicy
                  - logs:DeleteResourcePolicy
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                Resource: '*'
              - Sid: CloudWatch
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:factorial-*
                  - !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/factorial-*
              # AgentCore resources are scoped by name. Harness and runtime
              # names allow only [A-Za-z0-9_], hence factorial_; a harness's
              # underlying runtime and workload identity are prefixed harness_.
              # Gateway names allow hyphens, and a gateway's ID (and ARN) is
              # its lower-cased name plus a random suffix, hence factorial-.
              - Sid: AgentCore
                Effect: Allow
                Action: bedrock-agentcore:*
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/factorial_*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/factorial-*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/factorial_*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/harness_factorial_*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/*credentialprovider/factorial-*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/factorial*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/harness_factorial_*
              # These actions authorise against no resource, so cannot be
              # scoped by name; everything done to the result afterwards is.
              # Other AgentCore resource types (memory, ...) are added here
              # when Factorial first needs them.
              - Sid: AgentCoreUnscoped
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateHarness
                  - bedrock-agentcore:CreateAgentRuntime
                  - bedrock-agentcore:CreateGateway
                  - bedrock-agentcore:List*
                Resource: '*'
              # Creating a harness creates its runtime, and the runtime's
              # first endpoint is authorised against runtime/* because the
              # runtime's ID does not exist yet (refused for
              # factorial_planner on 2026-10-19; on 2026-10-17 the same
              # call for the builder was checked against its real name, so
              # the service changed). Every later endpoint is checked
              # against the named runtime, which the AgentCore statement
              # covers. The ARN cannot be narrowed, so the grant is limited
              # to calls AgentCore makes on this role's behalf: a template
              # cannot create an endpoint on another runtime directly.
              - Sid: AgentCoreRuntimeEndpointOnCreate
                Effect: Allow
                Action: bedrock-agentcore:CreateAgentRuntimeEndpoint
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                Condition:
                  Bool:
                    aws:ViaAWSService: 'true'
              # A gateway's or harness's ARN embeds an ID assigned at
              # creation, so tagging on create is authorised against
              # gateway/* or harness/*, not the factorial name (harnesses:
              # CreateHarness for factorial_planner was refused on
              # 2026-10-19). Only the stack tag, and the aws:cloudformation:*
              # tags CloudFormation adds to every create (seen in CloudTrail
              # on 2026-10-18), may be applied, from a factorial- stack. This
              # also lets the role add Project=Factorial to any gateway or
              # harness in the account, so never grant AgentCore access by
              # aws:ResourceTag/Project.
              - Sid: AgentCoreTagOnCreate
                Effect: Allow
                Action: bedrock-agentcore:TagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/*
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: Factorial
                  StringLike:
                    aws:RequestTag/aws:cloudformation:stack-name: factorial-*
                  ForAllValues:StringEquals:
                    aws:TagKeys:
                      - Project
                      - aws:cloudformation:stack-name
                      - aws:cloudformation:stack-id
                      - aws:cloudformation:logical-id
              # The runtime AgentCore creates with a harness is tagged with
              # the stack tag only: CloudFormation's aws:cloudformation:* tags
              # stay on the harness (CreateAgentRuntime for
              # harness_factorial_planner carried only Project=Factorial and
              # was refused on 2026-10-21). Its ARN is runtime/* for the same
              # reason as the endpoint above. As with harnesses, this lets the
              # role add Project=Factorial to any runtime, which grants
              # nothing.
              - Sid: AgentCoreRuntimeTagOnCreate
                Effect: Allow
                Action: bedrock-agentcore:TagResource
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: Factorial
                  ForAllValues:StringEquals:
                    aws:TagKeys:
                      - Project
              - Sid: ContainerRegistry
                Effect: Allow
                Action: ecr:*
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/factorial/*
              - Sid: ContainerRegistryRead
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:DescribeRepositories
                Resource: '*'
              - Sid: S3
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::factorial-*
                  - !Sub arn:${AWS::Partition}:s3:::factorial-*/*
              - Sid: DynamoDB
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/factorial-*
              - Sid: Queues
                Effect: Allow
                Action: sqs:*
                Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:factorial-*
              - Sid: Topics
                Effect: Allow
                Action: sns:*
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:factorial-*
              - Sid: Secrets
                Effect: Allow
                Action: secretsmanager:*
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:factorial/*
              - Sid: GenerateSecretValues
                Effect: Allow
                Action: secretsmanager:GetRandomPassword
                Resource: '*'
              - Sid: Parameters
                Effect: Allow
                Action: ssm:*
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/factorial/*
              # Network for the Fargate invoker. EC2 has no name scoping, so
              # creation requires the Project=Factorial tag (the deploy
              # workflow tags every stack) and every later mutation requires
              # the resource to carry it. Pre-existing networks in the account
              # are untouchable. The boundary denies all of EC2 to every role
              # Factorial creates, so only deployments reach this at all.
              - Sid: NetworkRead
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeVpcAttribute
                  - ec2:DescribeSubnets
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeTags
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
              - Sid: NetworkCreateTagged
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:CreateSubnet
                  - ec2:CreateInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: Factorial
              # Creating a subnet, security group or route table is also
              # authorised against the parent VPC, where request tags do not
              # apply; the VPC itself must carry the tag instead.
              - Sid: NetworkCreateInsideFactorialVpc
                Effect: Allow
                Action:
                  - ec2:CreateSubnet
                  - ec2:CreateSecurityGroup
                  - ec2:CreateRouteTable
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: Factorial
              - Sid: NetworkTagOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource: '*'
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - CreateVpc
                      - CreateSubnet
                      - CreateInternetGateway
                      - CreateRouteTable
                      - CreateSecurityGroup
              - Sid: NetworkMutateFactorialOnly
                Effect: Allow
                Action:
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DeleteRouteTable
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: Factorial
              - Sid: Containers
                Effect: Allow
                Action: ecs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/factorial-*
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/factorial-*:*
              - Sid: ContainersAccountLevel
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTaskDefinitions
                  - ecs:DescribeClusters
                Resource: '*'
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Deployment role. Assumable only by GitHub Actions jobs in the deploy
  # environment of the Factorial repository. It drives CloudFormation (which does the real
  # work through the execution role), publishes artefacts, and is the ONLY
  # principal allowed to move the live aliases.
  # ---------------------------------------------------------------------------
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-deploy
      Description: Assumed by GitHub Actions to deploy and promote Factorial.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Immutable subject format for a job that names an environment:
                # repo:<owner>@<ownerId>/<repo>@<repoId>:environment:<name>.
                # Other jobs on main (the test workflow's callback, any future
                # workflow) present a ref subject and cannot assume this role.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${DeployEnvironment}
      Policies:
        - PolicyName: factorial-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeployFactorialStacks
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/factorial-*/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/factorial-*/*
              - Sid: CloudFormationReadOnly
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: UseServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: TheFoundationIsDeployedByHumans
                Effect: Deny
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/factorial-foundation/*
              # Every stack operation runs as the execution role, so its scoping
              # always applies. Without a role, CloudFormation would act with
              # this role's own credentials.
              - Sid: AlwaysUseTheExecutionRole
                Effect: Deny
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:RollbackStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/*
                Condition:
                  StringNotEquals:
                    cloudformation:RoleArn: !GetAtt CloudFormationRole.Arn
              - Sid: HandWorkToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: PublishArtefacts
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt ArtefactBucket.Arn
              - Sid: PublishArtefactObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:AbortMultipartUpload
                Resource: !Sub ${ArtefactBucket.Arn}/*
              - Sid: ContainerRegistryAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  # Authenticated pulls of the base image from ECR Public;
                  # anonymous pulls are rate-limited on shared CI runners.
                  - ecr-public:GetAuthorizationToken
                  - sts:GetServiceBearerToken
                Resource: '*'
              - Sid: PushFactorialImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/factorial/*
              - Sid: PromoteLiveAliases
                Effect: Allow
                Action:
                  # Harness endpoint operations also perform the underlying
                  # runtime endpoint operations, so both sets are needed.
                  - bedrock-agentcore:GetHarness
                  - bedrock-agentcore:ListHarnessVersions
                  - bedrock-agentcore:GetHarnessEndpoint
                  - bedrock-agentcore:ListHarnessEndpoints
                  - bedrock-agentcore:UpdateHarnessEndpoint
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:ListAgentRuntimeVersions
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                  - bedrock-agentcore:ListAgentRuntimeEndpoints
                  - bedrock-agentcore:UpdateAgentRuntimeEndpoint
                  - states:DescribeStateMachine
                  - states:ListStateMachineVersions
                  - states:DescribeStateMachineAlias
                  - states:UpdateStateMachineAlias
                  - lambda:GetFunction
                  - lambda:ListVersionsByFunction
                  - lambda:GetAlias
                  - lambda:UpdateAlias
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/factorial_*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/factorial_*
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/harness_factorial_*
                  - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:factorial-*
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:factorial-*
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Artefacts: packaged templates and Lambda bundles uploaded by deployments.
  # ---------------------------------------------------------------------------
  ArtefactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub factorial-artefacts-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtefactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: Factorial

  ArtefactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtefactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtefactBucket.Arn
              - !Sub ${ArtefactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------------
  # Container registry for the agent harness environment image.
  # ---------------------------------------------------------------------------
  AgentEnvironmentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: factorial/agent-environment
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the most recent 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Container registry for the agent runtime image (Claude Agent SDK host).
  # ---------------------------------------------------------------------------
  AgentRuntimeRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: factorial/agent-runtime
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the most recent 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Container registry for the orchestration's harness invoker.
  # ---------------------------------------------------------------------------
  InvokerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: factorial/invoker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the most recent 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: Factorial

Outputs:
  GitHubOidcProviderArn:
    Value: !Ref GitHubOidcProvider
    Export:
      Name: Factorial-GitHubOidcProviderArn
  GitHubOidcSubjectPrefix:
    Description: Immutable OIDC subject prefix for this repository, for trust policies in other stacks.
    Value: !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}
    Export:
      Name: Factorial-GitHubOidcSubjectPrefix
  InvokerRepositoryUri:
    Value: !GetAtt InvokerRepository.RepositoryUri
    Export:
      Name: Factorial-InvokerRepositoryUri
  DeployRoleArn:
    Description: Role GitHub Actions assumes. Store as the AWS_DEPLOY_ROLE_ARN repository secret.
    Value: !GetAtt DeployRole.Arn
    Export:
      Name: Factorial-DeployRoleArn
  CloudFormationRoleArn:
    Description: Pass as --role-arn on every Factorial stack deployment.
    Value: !GetAtt CloudFormationRole.Arn
    Export:
      Name: Factorial-CloudFormationRoleArn
  PermissionsBoundaryArn:
    Description: Every role in Factorial's stacks must set this as its PermissionsBoundary.
    Value: !Ref PermissionsBoundary
    Export:
      Name: Factorial-PermissionsBoundaryArn
  AgentPermissionsBoundaryArn:
    Description: Every agent execution role (named factorial-agent or factorial-agent-*) must set this as its PermissionsBoundary.
    Value: !Ref AgentPermissionsBoundary
    Export:
      Name: Factorial-AgentPermissionsBoundaryArn
  ArtefactBucketName:
    Value: !Ref ArtefactBucket
    Export:
      Name: Factorial-ArtefactBucketName
  AgentEnvironmentRepositoryUri:
    Value: !GetAtt AgentEnvironmentRepository.RepositoryUri
    Export:
      Name: Factorial-AgentEnvironmentRepositoryUri
  AgentRuntimeRepositoryUri:
    Value: !GetAtt AgentRuntimeRepository.RepositoryUri
    Export:
      Name: Factorial-AgentRuntimeRepositoryUri
