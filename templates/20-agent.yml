AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Factorial agent: the builder harness, its execution role, the model API key
  credential and the live endpoint. Deployed by GitHub Actions.

Parameters:
  AgentImageTag:
    Type: String
    Description: Tag of the agent environment image in the factorial/agent-environment repository.
    AllowedPattern: '^[A-Za-z0-9._-]+$'
  ReasoningEffort:
    Type: String
    Default: high
    AllowedValues: [low, high, max]
    Description: >-
      GLM 5.3's reasoning_effort, passed through unchanged. The provider
      default is max, which produced ten-minute turns on a large context;
      thinking cannot be disabled on 5.3. Lower it if turns stay slow.
  ModelApiBase:
    Type: String
    Default: https://api.z.ai/api/paas/v4
    Description: OpenAI-compatible endpoint of the model provider.
  ModelApiKeySecretName:
    Type: String
    Default: factorial/zai/api-key
    Description: >-
      Secrets Manager secret holding {"apiKey": "..."} for the model provider.
      Created by a human; see docs/bootstrap.md.
  MaxIterations:
    Type: Number
    Default: 150
    Description: Reasoning and tool cycles per invocation before the harness stops.

Resources:
  # ---------------------------------------------------------------------------
  # Model credential. References a secret a human created; the key value never
  # passes through CloudFormation. The harness fetches it at invocation time.
  # ---------------------------------------------------------------------------
  ModelApiKey:
    Type: AWS::BedrockAgentCore::ApiKeyCredentialProvider
    Properties:
      Name: factorial-model-api-key
      ApiKeySecretSource: EXTERNAL
      ApiKeySecretConfig:
        SecretId: !Ref ModelApiKeySecretName
        JsonKey: apiKey
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # Execution role. Carries the agent permissions boundary, so it can never
  # deploy or promote Factorial, or reach beyond running the harness, whatever
  # the agent attempts. The factorial-agent name requires that boundary.
  # ---------------------------------------------------------------------------
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: factorial-agent
      Description: Execution role of the Factorial builder harness.
      PermissionsBoundary: !ImportValue Factorial-AgentPermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: factorial-agent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PullAgentImage
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/factorial/agent-environment
              - Sid: RegistryAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr-public:GetAuthorizationToken
                  - sts:GetServiceBearerToken
                Resource: '*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Sid: LogsAccountLevel
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/harness_factorial_builder-*
              - Sid: ModelApiKey
                Effect: Allow
                Action: bedrock-agentcore:GetResourceApiKey
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/apikeycredentialprovider/factorial-model-api-key
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/harness_factorial_builder-*
              # The harness resolves the API key credential provider by reading
              # the external secret under this role (verified: without this the
              # invocation fails with AccessDenied on GetSecretValue). The
              # aws:ViaAWSService condition allows only that service-mediated
              # read, not a direct call from the agent's shell with the same
              # role, so the key is not readable from inside a session.
              - Sid: ModelApiKeySecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ModelApiKeySecretName}-*
                Condition:
                  Bool:
                    aws:ViaAWSService: 'true'
              # Deliberately absent:
              # - GitHub credentials. The agent never pushes or calls GitHub;
              #   the orchestrator clones before and pushes after the agent runs
              #   with a short-lived, single-repository token never stored in
              #   the session.
              # - events:PutEvents. The agent's shell shares this role, so any
              #   event the harness could emit, a prompt-injected agent could
              #   forge. Completion is observed by the orchestrator instead.
      Tags:
        - Key: Project
          Value: Factorial

  # ---------------------------------------------------------------------------
  # The builder. One agent that both plans and builds (Stage 0). Every update
  # creates an immutable harness version; the live endpoint below is moved by
  # the deploy workflow's promotion step, never by this template.
  # ---------------------------------------------------------------------------
  BuilderHarness:
    Type: AWS::BedrockAgentCore::Harness
    Metadata:
      # cfn-lint's bundled schema predates OpenAiModelConfig.ApiBase, which the
      # live CloudFormation registry schema does define (checked 2026-10-16).
      cfn-lint:
        config:
          ignore_checks:
            - E3002
    Properties:
      HarnessName: factorial_builder
      ExecutionRoleArn: !GetAtt AgentRole.Arn
      EnvironmentArtifact:
        ContainerConfiguration:
          ContainerUri: !Join
            - ':'
            - - !ImportValue Factorial-AgentEnvironmentRepositoryUri
              - !Ref AgentImageTag
      Environment:
        AgentCoreRuntimeEnvironment:
          NetworkConfiguration:
            NetworkMode: PUBLIC
          LifecycleConfiguration:
            IdleRuntimeSessionTimeout: 900
            MaxLifetime: 14400
      # AWS_REGION is reserved and set by the runtime itself.
      EnvironmentVariables:
        FACTORIAL_WORKSPACE: /workspace
      Model:
        OpenAiModelConfig:
          # Fixed here, not a parameter: `cloudformation deploy` keeps a
          # parameter's previous value, so a changed default never reaches an
          # existing stack. The stack ran Flash while this said glm-5.3.
          # GLM 5.3 (flagship) since 2026-10-17, for a direct comparison with
          # Flash on issue #11 (Flash timed out after an hour without an edit).
          # Flash remains the cheaper option with reasoning_effort high.
          ModelId: glm-5.3
          ApiKeyArn: !GetAtt ModelApiKey.CredentialProviderArn
          ApiBase: !Ref ModelApiBase
          ApiFormat: chat_completions
          MaxTokens: 16384
          # Provider-specific request fields, passed through unchanged.
          AdditionalParams:
            reasoning_effort: !Ref ReasoningEffort
      SystemPrompt:
        - Text: |
            You are Factorial's builder agent. Factorial is a software factory: you receive one unit of work (a WorkItem) per session and turn it into a reviewable change in a git repository.

            Environment
            - The repository is already cloned at /workspace/repo and checked out on a branch created for this work. Work only inside that directory.
            - Available tools: bash shell and file operations. The shell has git, gh, node 22, npm, jq and curl. Do not install global tools.
            - Your AWS session identity is read-only with respect to Factorial itself. You cannot deploy or promote anything, and you should not try.

            How to work
            1. Read CLAUDE.md, README.md and any contributing or conventions files first. Follow the repository's conventions exactly: language, style, layout, test framework, commit message style.
            2. Understand the request before changing anything. Explore the code that the request touches.
            3. Make the smallest change that fully satisfies the request. Do not refactor, reformat or "improve" unrelated code.
            4. Add or update automated tests for behaviour you change. Run the repository's checks (tests, typecheck, lint) and fix any failure you caused.
            5. Commit your work in one or a few focused commits. Write commit messages in the imperative mood. Do not amend or rewrite history that existed before your session.
            6. Do not push, open pull requests, or change CI, deployment or credential configuration. The orchestrator pushes your branch and opens the pull request after you finish.
            7. When done, write /workspace/summary.md containing: what changed and why, how you verified it, and anything a reviewer should look at. This file becomes the pull request description.

            If the request is unclear, out of scope for a code change, or impossible, do not guess. Make no commits, and write /workspace/summary.md explaining what is missing or why it cannot be done.

            Never run destructive commands: no force pushes, no deleting branches, no history rewrites, no removing files outside the change you are making.
      AllowedTools:
        - '@builtin'
      Memory:
        Disabled: {}
      MaxIterations: !Ref MaxIterations
      # Wall-clock limit for the agent loop in one invocation. Fixed here, not
      # a parameter, so a change reaches the existing stack (see ModelId).
      # Keep it below the orchestration stack's BuildTimeoutSeconds (7200) so
      # the harness ends the loop itself and the Collect step still runs; a
      # Step Functions timeout would stop the invoker task and lose any
      # uncollected commits.
      TimeoutSeconds: 6600
      # No lifecycle hooks: a hook runs under the execution role, which the
      # agent's shell also holds, so hook events cannot be trusted as control
      # signals. The orchestrator observes completion directly.
      Tags:
        - Key: Project
          Value: Factorial

  # Created once at whatever version is current. TargetVersion is deliberately
  # not managed here: promotion is the deploy workflow's final step.
  LiveEndpoint:
    Type: AWS::BedrockAgentCore::HarnessEndpoint
    Properties:
      HarnessId: !GetAtt BuilderHarness.HarnessId
      EndpointName: live
      Description: The builder version handling new WorkItems.
      Tags:
        - Key: Project
          Value: Factorial

Outputs:
  BuilderHarnessArn:
    Value: !GetAtt BuilderHarness.Arn
    Export:
      Name: Factorial-BuilderHarnessArn
  BuilderHarnessId:
    Value: !GetAtt BuilderHarness.HarnessId
    Export:
      Name: Factorial-BuilderHarnessId
  BuilderLiveEndpointArn:
    Value: !GetAtt LiveEndpoint.Arn
    Export:
      Name: Factorial-BuilderLiveEndpointArn
  AgentRoleArn:
    Value: !GetAtt AgentRole.Arn
    Export:
      Name: Factorial-AgentRoleArn
