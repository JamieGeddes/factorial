<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="550" viewBox="0 0 940 550" role="img" aria-label="Claude Agent SDK host: the root host starts Claude Code once as the agent user; the model's loop and its tools run as agent, reach the host's policy through hook calls, and call Bedrock and the network with the execution role's credentials.">
<style>
svg{--bg:#f4f6f8;--panel:#ffffff;--fg:#1b2230;--muted:#5a6474;--line:#c5ccd7;--root:#a8521c;--root-tint:#f6e5d6;--agent:#1c7465;--agent-tint:#d9eee9;--loop:#3346c8;--loop-tint:#e6e9fb;color:var(--fg);font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#11151b;--panel:#1a2029;--fg:#e3e8ef;--muted:#9aa4b4;--line:#3a4351;--root:#e48c55;--root-tint:#35241a;--agent:#52c2b0;--agent-tint:#15302c;--loop:#93a2ff;--loop-tint:#232a4d;}}
.bgp{fill:var(--panel)}
.vm{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 5}
.zr{fill:var(--root-tint);stroke:var(--root);stroke-width:1.5}
.za{fill:var(--agent-tint);stroke:var(--agent);stroke-width:1.5}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.ext{fill:var(--bg);stroke:var(--muted);stroke-width:1.2}
.loopb{fill:var(--loop-tint);stroke:var(--loop);stroke-width:2.5}
.ln{fill:none;stroke:currentColor;stroke-width:1.4}
.hook{stroke-dasharray:5 4}
.t{fill:var(--fg);font-size:12.5px;font-weight:500}
.s{fill:var(--muted);font-size:10.5px}
.l{fill:var(--fg);font-size:11px}
.zt{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.zt.r{fill:var(--root)}
.zt.a{fill:var(--agent)}
.vt{fill:var(--muted);font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:10.5px}
.lt{fill:var(--loop);font-weight:600;font-size:12.5px}
</style>
<rect class="bgp" x="0" y="0" width="940" height="550" rx="10"/>
          <defs>
            <marker id="arSdk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          </defs>
          <rect class="vm" x="290" y="24" width="430" height="510" rx="12"/>
          <text class="vt" x="305" y="44">AgentCore Runtime session (microVM)</text>

          <rect class="zr" x="310" y="58" width="390" height="170" rx="9"/>
          <rect class="za" x="310" y="320" width="390" height="200" rx="9"/>
          <text class="zt r" x="325" y="80">Host process · root</text>
          <rect class="box" x="325" y="92" width="150" height="40" rx="6"/>
          <text class="t" x="400" y="117" text-anchor="middle">Run contract server</text>
          <rect class="box" x="535" y="92" width="150" height="40" rx="6"/>
          <text class="t" x="610" y="117" text-anchor="middle">Time limit · abort</text>
          <rect class="box" x="325" y="172" width="150" height="40" rx="6"/>
          <text class="t" x="400" y="197" text-anchor="middle">Policy hooks</text>
          <rect class="box" x="535" y="172" width="150" height="40" rx="6"/>
          <text class="t" x="610" y="190" text-anchor="middle">Run record</text>
          <text class="s" x="610" y="204" text-anchor="middle">/var/lib/factorial (0700)</text>

          <line class="ln hook" x1="400" y1="360" x2="400" y2="214" marker-end="url(#arSdk)"/>
          <text class="l" x="410" y="252">hook calls over stdio</text>
          <text class="s" x="410" y="266">allow · deny · send back</text>
          <line class="ln" x1="610" y1="214" x2="610" y2="358" marker-end="url(#arSdk)"/>
          <text class="l" x="600" y="290" text-anchor="end">starts Claude Code once</text>
          <text class="s" x="600" y="304" text-anchor="end">setpriv → agent, no capabilities</text>

          <rect class="box" x="325" y="360" width="150" height="48" rx="6"/>
          <text class="t" x="400" y="380" text-anchor="middle">Tools</text>
          <text class="s" x="400" y="396" text-anchor="middle">Bash · Read · Edit · Write…</text>
          <rect class="loopb" x="535" y="360" width="150" height="48" rx="6"/>
          <text class="lt" x="610" y="380" text-anchor="middle">Model loop</text>
          <text class="s" x="610" y="396" text-anchor="middle">+ subagents</text>
          <line class="ln" x1="535" y1="384" x2="478" y2="384" marker-end="url(#arSdk)"/>
          <text class="s" x="506" y="377" text-anchor="middle">calls</text>
          <rect class="box" x="325" y="446" width="150" height="40" rx="6"/>
          <text class="t" x="400" y="463" text-anchor="middle">/workspace</text>
          <text class="s" x="400" y="477" text-anchor="middle">agent-owned</text>
          <line class="ln" x1="400" y1="408" x2="400" y2="444" marker-end="url(#arSdk)"/>
          <text class="s" x="408" y="431">read · write · run</text>
          <text class="zt a" x="325" y="508">Claude Code subprocess · agent (uid 1000)</text>

          <rect class="ext" x="790" y="360" width="130" height="48" rx="6"/>
          <text class="t" x="855" y="380" text-anchor="middle">Amazon Bedrock</text>
          <text class="s" x="855" y="396" text-anchor="middle">Claude, global profiles</text>
          <line class="ln" x1="685" y1="384" x2="788" y2="384" marker-end="url(#arSdk)"/>
          <text class="s" x="737" y="376" text-anchor="middle">model calls</text>

          <rect class="ext" x="790" y="446" width="130" height="48" rx="6"/>
          <text class="t" x="855" y="466" text-anchor="middle">Internet · AWS</text>
          <text class="s" x="855" y="482" text-anchor="middle">as the execution role</text>
          <polyline class="ln" points="475,398 500,398 500,470 788,470" marker-end="url(#arSdk)"/>
          <text class="s" x="600" y="462" text-anchor="middle">shell: network + role credentials</text>

          <rect class="ext" x="20" y="92" width="150" height="48" rx="6"/>
          <text class="t" x="95" y="112" text-anchor="middle">Invoker</text>
          <text class="s" x="95" y="128" text-anchor="middle">Fargate task</text>
          <line class="ln" x1="170" y1="104" x2="323" y2="104" marker-end="url(#arSdk)"/>
          <text class="s" x="230" y="97" text-anchor="middle">run · attach · status</text>
          <line class="ln" x1="325" y1="122" x2="172" y2="122" marker-end="url(#arSdk)"/>
          <text class="s" x="230" y="137" text-anchor="middle">run events (SSE)</text>

          <rect class="ext" x="20" y="438" width="150" height="56" rx="6"/>
          <text class="t" x="95" y="461" text-anchor="middle">Orchestrator</text>
          <text class="s" x="95" y="477" text-anchor="middle">session commands</text>
          <line class="ln" x1="170" y1="466" x2="323" y2="466" marker-end="url(#arSdk)"/>
          <text class="s" x="95" y="512" text-anchor="middle">seeds as root, then chown;</text>
          <text class="s" x="95" y="526" text-anchor="middle">reads back as agent</text>
        </svg>
